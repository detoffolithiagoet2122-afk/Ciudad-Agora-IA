function renderInicio(cu){
  const myGroups=state.groups.filter(g=>g.members.includes(cu.id));
  // Solo lo que viene, ordenado por fecha (los pasados quedan en cada grupo).
  const upcoming=[];
  myGroups.forEach(g=>upcomingOf(g).forEach(m=>upcoming.push({g,m})));
  upcoming.sort((a,b)=>meetupKey(a.m)<meetupKey(b.m)?-1:1);
  const recs=recommendGroups(cu,myGroups.length?3:6);
  // Encuentros que vienen en grupos donde todavía no estás, de tus temas.
  const discover=allUpcoming().filter(({g})=>!g.members.includes(cu.id)&&cu.categories.includes(g.categoryId)).slice(0,3);
  const pendingRecaps=[];
  myGroups.forEach(g=>pastOf(g).forEach(m=>{
    if(m.going.includes(cu.id)&&!(m.recaps||[]).some(r=>r.authorId===cu.id)&&daysFromToday(m.eventDate||'1900-01-01')>=-14)pendingRecaps.push({g,m});
  }));

  const recsHTML=recs.length?`
    <div class="block-title" style="margin-top:34px">Grupos que te pueden gustar</div>
    <div class="card-grid">${recs.map(recommendedCardHTML).join('')}</div>`:'';
  const discoverHTML=discover.length?`
    <div class="block-title" style="margin-top:34px">Encuentros de tus temas en otros grupos</div>
    ${discover.map(({g,m})=>`
      <div class="upnext-row" onclick="openMeetup('${g.id}','${m.id}')">
        <div>
          <div class="ttitle">${esc(m.title)} · <span style="color:var(--text-faint);font-weight:500">${esc(g.name)}</span></div>
          <div class="tmeta">${ICONS.pin} ${esc(m.place)} — ${esc(meetupWhen(m))}</div>
          ${m.level&&m.level!=='todos'?`<div class="badges-row">${levelBadge(m)}</div>`:''}
        </div>
        <div class="notch-badge">${esc(catLabel(g.categoryId))}</div>
      </div>`).join('')}`:'';

  if(myGroups.length===0){
    return `
    <h1 class="app-h1">Hola, ${esc(cu.name.split(' ')[0])}.</h1>
    <p class="app-sub">Todavía no estás en ningún grupo. Arranquemos.</p>
    <div class="empty-state">
      <h3>Tu tablón está vacío</h3>
      <p>Explorá los grupos que ya se están juntando en tu ciudad, o armá el tuyo si el tema que buscás todavía no existe.</p>
      <div class="empty-actions">
        <button class="btn btn-primary" onclick="setAppView('explorar')">${ICONS.compass}Explorar grupos</button>
        <button class="btn btn-dark" onclick="setAppView('crear')">${ICONS.plus}Crear un grupo</button>
      </div>
    </div>
    ${cu.categories.length?'':`<p class="app-sub" style="margin-top:18px">Tip: elegí tus temas en <button class="link-btn" onclick="openProfile()">Mi perfil</button> y te recomendamos grupos.</p>`}
    ${recsHTML}${discoverHTML}`;
  }

  return `
  <h1 class="app-h1">Hola, ${esc(cu.name.split(' ')[0])}.</h1>
  <p class="app-sub">Esto es lo que se viene en tus grupos.</p>

  ${pendingRecaps.length?`
  <div class="safety-card" style="border-left-color:var(--yellow)">
    <b>¿Cómo estuvo?</b> Fuiste a ${pendingRecaps.length===1?'"'+esc(pendingRecaps[0].m.title)+'"':plural(pendingRecaps.length,'encuentro')}. Contale al grupo cómo salió (y subí una foto si querés).
    <div style="margin-top:10px"><button class="btn btn-sm btn-dark" onclick="openMeetup('${pendingRecaps[0].g.id}','${pendingRecaps[0].m.id}');state.recapFormMeetupId='${pendingRecaps[0].m.id}';render()">Contar cómo estuvo</button></div>
  </div>`:''}

  <div class="block-title">Tus próximos encuentros <button class="link-btn" style="font-size:12.5px;display:inline-flex;align-items:center;gap:5px" onclick="openCalendar()">${ICONS.calendar}Ver calendario</button></div>
  ${upcoming.length?upcoming.slice(0,6).map(({g,m})=>{
    const going=m.going.includes(cu.id),waiting=(m.waitlist||[]).includes(cu.id);
    return `
    <div class="upnext-row" onclick="openMeetup('${g.id}','${m.id}')">

function renderCalendario(cu){
  const filter=state.calFilter;
  const events=calendarEvents(cu,filter);
  const byDay={};
  events.forEach(e=>{if(e.m.eventDate)(byDay[e.m.eventDate]=byDay[e.m.eventDate]||[]).push(e);});
  const undated=events.filter(e=>!e.m.eventDate);
  const today=todayYmd();
  const sel=calSelectedDay();
  const month=calMonthShown();
  const [y,mo]=month.split('-').map(Number);
  const lead=(new Date(y,mo-1,1).getDay()+6)%7; // la semana arranca el lunes
  const cells=[];
  for(let i=0;i<42;i++)cells.push(ymd(new Date(y,mo-1,1-lead+i)));

  const myNext=calendarEvents(cu,'going').filter(e=>e.m.eventDate&&!isMeetupPast(e.m));
  const next=myNext[0];
  const upcoming=events.filter(e=>e.m.eventDate&&!isMeetupPast(e.m)).slice(0,6);
  const dayEvents=byDay[sel]||[];
  const selDate=parseYmd(sel);
  const selRel=daysFromToday(sel);
  const monthCount=events.filter(e=>e.m.eventDate&&e.m.eventDate.slice(0,7)===month).length;

  let nextBanner;
  if(next){
    const n=daysFromToday(next.m.eventDate);
    nextBanner=`
    <div class="cal-next" onclick="calSelectDay('${next.m.eventDate}')" title="Ver ese día en el calendario">
      <span class="tape"></span>
      <div class="cn-count">
        <div class="n">${n===0?'HOY':n}</div>
        <div class="l">${n===0?'a las '+esc(next.m.eventTime||''):n===1?'día':'días'}</div>
      </div>
      <div class="cn-info">
        <div class="eyebrow">tu próximo plan</div>
        <h2 class="cn-title">${esc(next.m.title)}</h2>
        <div class="cn-meta">
          <span>${ICONS.calendar}${esc(capFirst(DIAS_LARGOS[parseYmd(next.m.eventDate).getDay()]))} ${parseYmd(next.m.eventDate).getDate()} de ${MESES[parseYmd(next.m.eventDate).getMonth()]}</span>
          <span>${ICONS.clock}${esc(next.m.eventTime||'')} hs</span>
          <span>${ICONS.pin}${esc(next.m.place)}</span>
          <span>${ICONS.groups}${esc(next.g.name)}</span>
        </div>
      </div>
      <button class="btn btn-sm btn-primary" onclick="event.stopPropagation();calOpenGroup('${next.g.id}')">Ver grupo</button>
    </div>`;
  }else{
    nextBanner=`
    <div class="cal-next" style="cursor:default">
      <span class="tape"></span>
      <div class="cn-info">
        <div class="eyebrow">tu próximo plan</div>
        <h2 class="cn-title">Todavía no te anotaste en nada</h2>
        <div class="cn-meta"><span>Cuando toques "Voy" en un encuentro, aparece acá y en el calendario.</span></div>
      </div>
      ${filter==='going'
        ?`<button class="btn btn-sm btn-primary" onclick="calSetFilter('all')">Ver lo de mis grupos</button>`
        :`<button class="btn btn-sm btn-primary" onclick="setAppView('explorar')">${ICONS.compass}Explorar grupos</button>`}
    </div>`;
  }

  return `
  <div class="cal-top">
    <div>
      <h1 class="app-h1">Tu calendario</h1>
      <p class="app-sub">Día, hora y lugar de cada encuentro, todo en un mismo lugar.</p>
    </div>
    <div class="seg" role="tablist">
      <button class="${filter==='going'?'on':''}" onclick="calSetFilter('going')">A los que voy</button>
      <button class="${filter==='all'?'on':''}" onclick="calSetFilter('all')">Todo mis grupos</button>
    </div>
  </div>

  ${nextBanner}

  <div class="cal-layout">
    <div class="cal-card">
      <div class="cal-head">
        <h2 class="cal-month">${capFirst(MESES[mo-1])}<span class="yr">${y}</span></h2>
        <div class="cal-nav">
          <button class="icon-btn" onclick="calShiftMonth(-1)" title="Mes anterior">${ICONS.back}</button>
          <button class="btn btn-sm btn-ghost" style="border-color:var(--ink);color:var(--ink);box-shadow:3px 3px 0 var(--card-shadow)" onclick="calGoToday()">Hoy</button>
          <button class="icon-btn" onclick="calShiftMonth(1)" title="Mes siguiente">${ICONS.next}</button>
        </div>
      </div>
      <div class="cal-wd">${DIAS_CAL.map(d=>`<span>${d}</span>`).join('')}</div>
      <div class="cal-grid ${state.calAnim?'anim-'+state.calAnim:''}">
        ${cells.map((ds,i)=>{
          const list=byDay[ds]||[];
          const dow=i%7;
          const cls=['cal-day'];
          if(ds.slice(0,7)!==month)cls.push('out');
          if(dow>=5)cls.push('we');
          if(ds===today)cls.push('today');
          if(ds<today)cls.push('past');
          if(ds===sel){cls.push('sel');if(state.calAgendaAnim)cls.push('pop');}
          const tip=list.map(e=>(e.m.eventTime||'')+' '+e.m.title+' ('+e.g.name+')').join('\n');
          return `<button class="${cls.join(' ')}" style="--i:${i}" onclick="calSelectDay('${ds}')" ${tip?`title="${esc(tip)}"`:''} aria-label="${parseYmd(ds).getDate()} de ${MESES[parseYmd(ds).getMonth()]}${list.length?', '+list.length+' encuentro'+(list.length===1?'':'s'):''}">

            ${list.length?`<span class="cd-evs">

        <span>${monthCount} encuentro${monthCount===1?'':'s'} este mes</span>
        <span class="kbd-tip">Tip: movete con las flechas del teclado</span>
      </div>
    </div>

    <div class="cal-side">
      <div class="cal-card">
        <div class="agenda-head">
          <div class="ah-num">${selDate.getDate()}</div>
          <div>
            <div class="ah-wd">${capFirst(DIAS_LARGOS[selDate.getDay()])}</div>
            <div class="ah-mo">${MESES[selDate.getMonth()]} ${selDate.getFullYear()}</div>
          </div>
          <span class="notch-badge">${relDayLabel(selRel)}</span>
        </div>
        ${dayEvents.length?`<div class="ct-list ${state.calAgendaAnim?'anim':''}">${dayEvents.map((e,i)=>calTicketHTML(e,cu,i)).join('')}</div>`:`
        <div class="agenda-empty">
          ${ICONS.calEmpty}
          <p>${selRel<0?'Ese día no tuviste encuentros.':filter==='going'?'No tenés nada anotado para este día.':'No hay encuentros en tus grupos este día.'}</p>
          ${upcoming.length&&upcoming[0].m.eventDate!==sel?`<button class="btn btn-sm btn-dark" onclick="calSelectDay('${upcoming[0].m.eventDate}')">Ir al próximo</button>`:''}
        </div>`}
      </div>

      <div class="cal-card">
        <h3 class="card-title">${ICONS.clock}Lo que viene</h3>
        ${upcoming.length?upcoming.map(e=>{
          const d=parseYmd(e.m.eventDate),n=daysFromToday(e.m.eventDate);
          return `<div class="up-row ev-${catColorName(e.g.categoryId)}" onclick="calSelectDay('${e.m.eventDate}')">
            <div class="up-date"><span class="m">${MESES[d.getMonth()].slice(0,3)}</span><span class="d">${d.getDate()}</span></div>
            <div class="up-txt">
              <div class="mr-title">${esc(e.m.title)}</div>
              <div class="mr-meta">${esc(e.m.eventTime||'')} hs · ${esc(e.m.place)}</div>
            </div>
            <span class="up-rel ${n<=1?'soon':''}">${relDayLabel(n)}</span>
          </div>`;
        }).join(''):`<p class="card-sub" style="margin:0">${filter==='going'?'No te anotaste en ningún encuentro que venga.':'Tus grupos no tienen encuentros programados.'} <button class="link-btn" onclick="setAppView('misgrupos')">Ir a mis grupos</button></p>`}
      </div>

      ${undated.length?`
      <div class="cal-card">
        <h3 class="card-title">${ICONS.calendar}Sin fecha exacta</h3>
        <p class="card-sub">Estos encuentros se cargaron con la fecha en texto, por eso no aparecen en la grilla.</p>
        ${undated.map(e=>`
          <div class="mini-row" onclick="calOpenGroup('${e.g.id}')">
            <div><div class="mr-title">${esc(e.m.title)}</div><div class="mr-meta">${esc(e.m.place)} — ${esc(e.m.date)}</div></div>
            <span class="notch-badge">${esc(e.g.name)}</span>
          </div>`).join('')}
      </div>`:''}
    </div>
  </div>
  `;
}

/* ================= PERFIL =================
   Tu perfil (editable) o el de otra persona (solo lectura). Todas las
   estadísticas salen de lo que ya trajo el bootstrap, sin pedir nada extra. */
function profileStats(u){
  const groups=state.groups.filter(g=>g.members.includes(u.id));
  let meetupsGoing=0,posts=0,reactionsGot=0;
  state.groups.forEach(g=>{
    g.meetups.forEach(m=>{if(m.going.includes(u.id))meetupsGoing++;});
    (g.posts||[]).forEach(p=>{if(p.authorId===u.id){posts++;reactionsGot+=reactionTotal(p);}});
  });
  return {groups,meetupsGoing,posts,reactionsGot,friends:u.friends.length};
}

function renderPerfil(cu){
  const u=getUser(state.profileUserId||cu.id);
  if(!u)return `<p>Ese perfil ya no existe.</p>`;
  const isMe=u.id===cu.id;
  const isDemo=isMe&&cu.handle==='@biaferreyra';
  const st=profileStats(u);
  const upcoming=[];
  st.groups.forEach(g=>upcomingOf(g).forEach(m=>{if(m.going.includes(u.id))upcoming.push({g,m});}));
  upcoming.sort((a,b)=>meetupKey(a.m)<meetupKey(b.m)?-1:1);
  const iBlocked=!isMe&&state.blockedIds.includes(u.id);
  const hidden=!isMe&&isHiddenUser(u.id);
  const cats=isMe&&state.profileCats?state.profileCats:u.categories;
  const catsDirty=isMe&&state.profileCats&&(state.profileCats.slice().sort().join()!==u.categories.slice().sort().join());
  const shared=isMe?[]:u.categories.filter(c=>cu.categories.includes(c));

  return `
  ${!isMe?`<button class="back-btn" onclick="profileGoBack()" style="color:var(--ink);opacity:0.6">${ICONS.back}Volver</button>`:''}
  <div class="profile-hero">
    ${isMe?`<div class="hero-ribbon">tu perfil</div>`:''}
    <div class="profile-avatar-wrap">
      ${avatarHTML(u,124)}
      ${isMe?`<label class="avatar-cam" title="${u.avatarPath?'Cambiar foto':'Agregar foto'}">${ICONS.camera}

    </div>
    <div class="profile-info">
      <span class="tag tag-${PALETTE[u.colorIdx%5]}">${esc(u.handle)}</span>
      <h2>${esc(u.name)}</h2>
      <div class="profile-meta">
        ${u.zone?`<span>${ICONS.pin}${esc(u.zone)}</span>`:''}
        ${u.memberSince?`<span>${ICONS.calendar}En Tablón desde ${esc(u.memberSince)}</span>`:''}

      <div class="form-card">
        <h3 class="card-title">${ICONS.tag}Mis temas</h3>

        <h3 class="card-title">${ICONS.sun}Apariencia</h3>

        <h3 class="card-title">${ICONS.groups}Mis grupos</h3>

function renderGrupoDetalle(cu){
  const g=getGroup(state.activeGroupId);
  if(!g)return `<p>Ese grupo ya no existe.</p>`;
  const isMember=g.members.includes(cu.id);
  const isAdmin=g.admins.includes(cu.id);
  const members=g.members.map(getUser).filter(Boolean);
  const tabs=[['encuentros','Encuentros'],['chat','Chat'],['muro','Muro'],['miembros','Miembros']];
  if(isAdmin||state.isModerator)tabs.push(['denuncias','Denuncias']);
  const tab=tabs.some(t=>t[0]===state.groupTab)?state.groupTab:'encuentros';

  return `
  <button class="back-btn" onclick="setAppView('${isMember?'misgrupos':'explorar'}')" style="color:var(--ink);opacity:0.6">${ICONS.back}Volver</button>
  <div class="group-header">
    ${g.photoPath?`<img src="api/${esc(g.photoPath)}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:2px solid var(--paper);margin-bottom:12px;display:block"/>`:''}
    ${isAdmin?`<label style="font-size:11px;cursor:pointer;color:var(--paper);opacity:0.8;text-decoration:underline;display:inline-block;margin-bottom:14px">
      ${g.photoPath?'Cambiar foto del grupo':'Agregar foto al grupo'}
      <input type="file" accept="image/*" style="display:none" onchange="uploadGroupPhoto(this,'${g.id}')"/>
    </label>`:''}
    <span class="tag tag-${catColorName(g.categoryId)}">${esc(catLabel(g.categoryId))}</span>
    <h2>${esc(g.name)}</h2>
    <div class="zone-row">${ICONS.pin} ${esc(g.zone)} <span style="opacity:0.7">· ${esc(activityLabel(g))}</span></div>
    <div class="desc">${esc(g.description)}</div>
    <div class="group-header-foot">
      <div style="display:flex;align-items:center">
        <div class="avatar-stack">${members.slice(0,5).map(u=>avatarHTML(u,30)).join('')}</div>
        <span class="count-pill">${plural(g.members.length,'miembro')}${isAdmin?' · sos admin':''}</span>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-sm btn-ghost" onclick="shareGroup('${g.id}')">${ICONS.share}Compartir</button>
        ${isMember?`<button class="btn btn-sm btn-ghost" onclick="leaveGroup('${g.id}')">Salir del grupo</button>`
                  :`<button class="btn btn-sm btn-primary" onclick="joinGroup('${g.id}')">Unirme al grupo</button>`}
        ${!isAdmin?`<button class="link-btn" style="font-size:11.5px;color:#c7c9d6" onclick="openReport('group','${g.id}',null)">Denunciar grupo</button>`:''}
      </div>
    </div>
  </div>

  <div class="tabs-row" style="overflow-x:auto">
    ${tabs.map(([id,label])=>`<button class="tab-btn ${tab===id?'active':''}" onclick="setGroupTab('${id}')">${label}${id==='denuncias'&&state.modReports?' ('+state.modReports.filter(r=>r.groupId===g.id).length+')':''}</button>`).join('')}
  </div>

  ${tab==='encuentros'?renderEncuentrosTab(g,cu,isMember,isAdmin):''}
  ${tab==='chat'?renderChatTab(g,cu,isMember):''}
  ${tab==='muro'?renderMuroTab(g,cu,isMember,isAdmin):''}
  ${tab==='miembros'?renderMiembrosTab(g,cu,members,isAdmin):''}
  ${tab==='denuncias'?renderDenunciasTab(g):''}
  `;
}

function meetupFormFields(m){
  m=m||{};
  const lv=m.level||'todos';
  return `
    <div class="field"><label>Título</label><input name="title" value="${esc(m.title||'')}" placeholder="Ej: Rodada de jueves" maxlength="160" required/></div>
    <div class="form-row">
      <div class="field"><label>Fecha y hora</label>
        <div style="display:flex;gap:8px">
          <input type="date" name="date" value="${m.eventDate||''}" ${m.id?'':`min="${todayYmd()}"`} required style="flex:1;min-width:0"/>
          <input type="time" name="time" value="${m.eventTime||''}" required style="flex:1;min-width:0"/>
        </div>
      </div>
      <div class="field"><label>Lugar</label><input name="place" value="${esc(m.place||'')}" list="safezones-list-meetup" maxlength="200" placeholder="Elegí un lugar público sugerido o escribí el tuyo" required/>${safeZonesDatalist('safezones-list-meetup')}</div>
    </div>
    <div class="form-row" style="margin-top:15px">
      <div class="field"><label>Cupo (opcional)</label><input type="number" name="capacity" min="2" max="500" value="${m.capacity||''}" placeholder="Sin límite"/>
        <div class="mono" style="font-size:10px;color:var(--text-dim);margin-top:5px">Ej: 4 para una mesa de rol. Si se llena, la gente queda en lista de espera.</div></div>
      <div class="field"><label>¿Para quién es?</label>
        <select name="level">${Object.entries(LEVELS).map(([id,label])=>`<option value="${id}" ${lv===id?'selected':''}>${esc(label)}</option>`).join('')}</select>
        <div class="mono" style="font-size:10px;color:var(--text-dim);margin-top:5px">"Ideal primera vez" ayuda a que se sume gente nueva.</div></div>
    </div>`;
}

function upcomingTicketHTML(g,m,cu,isMember,isAdmin){
  const isOwner=m.createdBy===cu.id;
  const canManage=isOwner||isAdmin||state.isModerator;
  const full=isFull(m);
  const waiting=(m.waitlist||[]).length;
  const people=m.going.map(getUser).filter(u=>u&&!isHiddenUser(u.id));
  const gcal=googleCalUrl(g,m);
  return `
    <div class="ticket ${state.highlightMeetupId===m.id?'highlight':''}" id="meetup-${m.id}">
      <div class="tinfo" style="min-width:0">
        <div class="t-title">${esc(m.title)}${m.edited?' <span class="mono" style="font-size:10.5px;color:var(--text-dim);font-weight:400">(editado)</span>':''}</div>
        <div class="t-meta">${ICONS.pin} ${esc(m.place)} <span>${esc(meetupWhen(m))}</span> <span>${esc(relDayLabel(daysFromToday(m.eventDate)))}</span></div>
        <div class="badges-row">${levelBadge(m)}${full?'<span class="mini-badge badge-full">Completo</span>':''}${m.going.includes(cu.id)?'<span class="mini-badge fill" style="--c:var(--green)">Vas</span>':''}</div>
        <div class="tgoing" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${people.length?`<span class="avatar-stack">${people.slice(0,6).map(u=>avatarHTML(u,22)).join('')}</span>`:''}
          ${esc(spotsLabel(m))}${waiting?' · '+plural(waiting,'en espera','en espera'):''}
        </div>
        ${m.capacity!=null?`<div class="cap-bar ${full?'full':''}"><i style="width:${Math.min(100,Math.round(m.going.length/m.capacity*100))}%"></i></div>`:''}
        <div class="ticket-links">
          ${gcal?`<a class="link-btn" href="${esc(gcal)}" target="_blank" rel="noopener">+ Google Calendar</a>`:''}
          <button class="link-btn" onclick="downloadMeetupIcs('${g.id}','${m.id}')">.ics</button>
          <button class="link-btn" onclick="shareMeetup('${g.id}','${m.id}')">Compartir</button>
          ${isOwner?`<button class="link-btn" onclick="startEditMeetup('${m.id}')">Editar</button>`:''}
          ${canManage?`<button class="link-btn" style="color:#c9425e" onclick="deleteMeetup('${m.id}')">Borrar</button>`:''}
          ${!isOwner?reportLink('meetup',m.id,m.createdBy):''}
        </div>
      </div>
      ${isMember?`<div class="ticket-actions">${goingButtonHTML(g,m,cu)}</div>`:''}
    </div>`;
}

function pastTicketHTML(g,m,cu,isAdmin){
  const went=m.going.includes(cu.id);
  const recaps=(m.recaps||[]).filter(r=>!isHiddenUser(r.authorId));
  const myRecap=recaps.find(r=>r.authorId===cu.id);
  const formOpen=state.recapFormMeetupId===m.id;
  return `
  <div class="past-ticket ${state.highlightMeetupId===m.id?'highlight':''}" id="meetup-${m.id}">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div>
        <div class="t-title">${esc(m.title)}</div>
        <div class="t-meta">${ICONS.pin} ${esc(m.place)} · ${esc(meetupWhen(m))}</div>
        <div class="t-meta">${plural(m.going.length,'persona se anotó','personas se anotaron')}${recaps.length?' · '+plural(recaps.length,'confirmó que fue','confirmaron que fueron'):''}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-start">
        ${went&&!myRecap&&!formOpen?`<button class="btn btn-sm btn-primary" onclick="toggleRecapForm('${m.id}')">Fui · contar cómo estuvo</button>`:''}
        ${myRecap&&!formOpen?`<button class="link-btn" style="font-size:11.5px" onclick="toggleRecapForm('${m.id}')">Editar mi reseña</button>`:''}
        ${isAdmin||state.isModerator?`<button class="link-btn" style="font-size:11.5px;color:#c9425e" onclick="deleteMeetup('${m.id}')">Borrar</button>`:''}
      </div>
    </div>
    ${formOpen?`<form class="recap-form" onsubmit="submitRecap(event,'${m.id}')">
      <textarea name="text" maxlength="400" placeholder="¿Cómo estuvo? ¿Qué hicieron? ¿Lo repetirían?">${esc(myRecap?myRecap.text:'')}</textarea>
      <label class="mono" style="font-size:11px;color:var(--text-faint)">Foto (opcional, máx. 3MB): <input type="file" name="photo" accept="image/*"/></label>
      <p class="mono" style="font-size:10.5px;color:var(--text-dim);margin:0">Antes de subir una foto, preguntá si les molesta aparecer.</p>
      <div style="display:flex;gap:10px"><button class="btn btn-sm btn-primary" type="submit">Guardar</button>
      <button class="btn btn-sm btn-ghost" type="button" style="border-color:var(--ink);color:var(--ink);box-shadow:none" onclick="toggleRecapForm('${m.id}')">Cancelar</button></div>
    </form>`:''}
    ${recaps.map(r=>{
      const u=getUser(r.authorId);
      return `<div class="recap">
        ${u?`<button class="user-link" onclick="openProfile('${u.id}')">${avatarHTML(u,28)}</button>`:avatarHTML({name:'?',colorIdx:0},28)}
        <div class="recap-body">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-size:12.5px">${esc(u?u.name:'Alguien')}</b><span class="mini-badge fill" style="--c:var(--green);font-size:9px;padding:1px 5px">fue</span><span class="mono" style="font-size:10px;color:var(--text-dim)">${esc(r.time)}</span>
            ${r.authorId===cu.id||isAdmin||state.isModerator?`<button class="link-btn" style="font-size:10.5px;color:#c9425e" onclick="deleteRecap('${r.id}')">Borrar</button>`:''}
            ${reportLink('recap',r.id,r.authorId)}
          </div>
          ${r.text?`<div style="margin-top:3px">${esc(r.text)}</div>`:''}
          ${r.photoPath?`<img src="api/${esc(r.photoPath)}" alt="Foto del encuentro" loading="lazy"/>`:''}
        </div>
      </div>`;}).join('')}
  </div>`;
}

function renderEncuentrosTab(g,cu,isMember,isAdmin){
  const upcoming=upcomingOf(g);
  const past=pastOf(g);
  const editing=state.editingMeetupId?g.meetups.find(m=>m.id===state.editingMeetupId):null;
  return `
  <details class="safety-card"><summary>${ICONS.shield}Consejos para encontrarte seguro</summary>${SAFETY_LIST}</details>
  ${isMember?`
    ${state.meetupFormOpen?`
    <div class="inline-form">
      <form onsubmit="addMeetup(event,'${g.id}')">
        ${meetupFormFields()}
        <div class="mono" style="font-size:10.5px;color:var(--text-dim);margin:10px 0 2px">Para un primer encuentro, mejor un lugar público y con gente alrededor.</div>
        <div style="display:flex;gap:10px;margin-top:14px">
          <button class="btn btn-primary btn-sm" type="submit">Publicar encuentro</button>
          <button class="btn btn-ghost btn-sm" type="button" style="border-color:var(--ink);color:var(--ink);box-shadow:3px 3px 0 rgba(20,22,31,0.15)" onclick="toggleMeetupForm()">Cancelar</button>
        </div>
      </form>
    </div>`:`<button class="btn btn-dark btn-sm" style="margin-bottom:20px" onclick="toggleMeetupForm()">${ICONS.plus}Organizar un encuentro</button>`}
  `:`<div class="empty-state" style="margin-bottom:20px"><p style="margin:0">Unite al grupo para organizar encuentros y anotarte.</p></div>`}

  ${editing?`<div class="inline-form">
      <form onsubmit="editMeetup(event,'${editing.id}')">
        ${meetupFormFields(editing)}
        <div style="display:flex;gap:10px;margin-top:14px">
          <button class="btn btn-primary btn-sm" type="submit">Guardar cambios</button>
          <button class="btn btn-ghost btn-sm" type="button" style="border-color:var(--ink);color:var(--ink);box-shadow:3px 3px 0 rgba(20,22,31,0.15)" onclick="cancelEditMeetup()">Cancelar</button>
        </div>
      </form>
    </div>`:''}

  <div class="section-label">Próximos</div>
  ${upcoming.length?upcoming.filter(m=>!editing||m.id!==editing.id).map(m=>upcomingTicketHTML(g,m,cu,isMember,isAdmin)).join('')
    :`<div class="empty-state"><p style="margin:0">No hay encuentros programados.${isMember?' ¡Proponé el próximo!':''}</p></div>`}

  ${past.length?`
  <div class="section-label">Encuentros anteriores (${past.length})</div>
  ${state.showPastMeetups?past.map(m=>pastTicketHTML(g,m,cu,isAdmin)).join('')+`<button class="link-btn" onclick="state.showPastMeetups=false;render()">Ocultar anteriores</button>`
    :`<button class="btn btn-sm btn-ghost" style="border-color:var(--ink);color:var(--ink);box-shadow:none" onclick="state.showPastMeetups=true;render()">Ver encuentros anteriores y reseñas</button>`}`:''}
  `;
}

function commentHTML(c,cu,isAdmin){
  if(isHiddenUser(c.authorId))return '';
  const author=getUser(c.authorId);
  const canDelete=c.authorId===cu.id||isAdmin||state.isModerator;
  return `<div style="display:flex;gap:8px;margin-top:10px">
    ${avatarHTML(author||{name:'?',colorIdx:0},26)}
    <div style="flex:1;background:var(--paper-2);border-radius:5px;padding:8px 10px">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-weight:700;font-size:12px">${esc(author?author.name:'Alguien')}</span>
        <span class="mono" style="font-size:10px;color:var(--text-dim)">${esc(c.time)}</span>
      </div>
      <div style="font-size:12.5px;color:var(--text-2);line-height:1.4;margin-top:2px">${esc(c.text)}</div>
      <div style="display:flex;gap:10px;margin-top:3px">${canDelete?`<button class="link-btn" style="font-size:10.5px;color:#c9425e" onclick="deleteComment('${c.id}')">Borrar</button>`:''}${reportLink('comment',c.id,c.authorId)}</div>
    </div>
  </div>`;
}

function reactButtonsHTML(p,cu){
  const mine=myReactionOn(p,cu.id);
  const def=mine?reactionDef(mine):null;
  const pickerOpen=state.reactPickerPostId===p.id;
  return `<div class="react-wrap">
    <button class="react-btn ${mine?'mine':''}" style="${def?'--rc:'+def.color+';color:'+def.color:''}" onclick="quickReact('${p.id}')" title="${mine?'Sacar tu reacción':'Me gusta'}">
      ${mine?reactionSVG(mine,16):ICONS.thumb}${def?esc(def.label):'Me gusta'}
    </button>
    <button class="react-more" onclick="toggleReactPicker('${p.id}')" title="Elegir reacción">${ICONS.smilePlus}</button>
    ${pickerOpen?`<div class="react-picker">
      ${REACTIONS.map(r=>`<button class="react-opt ${mine===r.id?'mine':''}" onclick="reactToPost('${p.id}','${r.id}')" aria-label="${esc(r.label)}">
        ${reactionSVG(r.id,30)}<span class="ro-label">${esc(r.label)}</span>
      </button>`).join('')}
    </div>`:''}
  </div>`;
}
function reactionSummaryHTML(p){
  const total=reactionTotal(p);
  if(!total)return '';
  const r=p.reactions||{};
  const top=REACTIONS.filter(d=>(r[d.id]||[]).length).sort((a,b)=>r[b.id].length-r[a.id].length).slice(0,3);
  const names=reactionNames(p);
  const tip=names.slice(0,12).join('\n')+(names.length>12?'\ny '+(names.length-12)+' más':'');
  return `<span class="react-summary" title="${esc(tip)}">
    <span class="react-stack">${top.map(d=>reactionSVG(d.id,18)).join('')}</span>${total}
  </span>`;
}

function renderMuroTab(g,cu,isMember,isAdmin){
  const posts=(g.posts||[]).filter(p=>!isHiddenUser(p.authorId));
  return `
  ${isMember?`
  <form class="postform" onsubmit="addPost(event,'${g.id}')">
    ${avatarHTML(cu,38)}
    <div style="flex:1">
      <textarea name="text" placeholder="Escribí algo para el grupo..." maxlength="500" oninput="updateCounter(this,'postCounter',500)" required></textarea>
      <div class="char-counter" id="postCounter">0/500</div>
    </div>
    <button class="btn btn-sm btn-primary" type="submit">Publicar</button>
  </form>`:`<div class="empty-state" style="margin-bottom:20px"><p style="margin:0">Unite al grupo para participar del muro.</p></div>`}
  ${posts.length?posts.map(p=>{
    const author=getUser(p.authorId);
    const isOwner=p.authorId===cu.id;
    const canManage=isOwner||isAdmin||state.isModerator;
    const comments=(p.comments||[]).filter(c=>!isHiddenUser(c.authorId));
    const commentsOpen=state.openCommentsPostId===p.id;
    if(state.editingPostId===p.id){
      return `<div class="post">${avatarHTML(author,36)}
        <div class="p-body">
          <form onsubmit="editPost(event,'${p.id}')">
            <textarea name="text" maxlength="500" style="width:100%;padding:8px 10px;border:2px solid var(--ink);border-radius:4px;font-size:13.5px;min-height:60px" required>${esc(p.text)}</textarea>
            <div style="display:flex;gap:10px;margin-top:8px">
              <button class="btn btn-sm btn-primary" type="submit">Guardar</button>
              <button class="btn btn-sm btn-ghost" type="button" style="border-color:var(--ink);color:var(--ink);box-shadow:3px 3px 0 rgba(20,22,31,0.15)" onclick="cancelEditPost()">Cancelar</button>
            </div>
          </form>
        </div></div>`;
    }
    return `<div class="post">${author?`<button class="user-link" onclick="openProfile('${author.id}')" title="Ver perfil">${avatarHTML(author,36)}</button>`:avatarHTML({name:'?',colorIdx:0},36)}
      <div class="p-body">
        <div class="p-head">${author?`<button class="user-link p-name" onclick="openProfile('${author.id}')">${esc(author.name)}</button>`:`<span class="p-name">Alguien</span>`}<span class="p-time">${esc(p.time)}${p.edited?' · editado':''}</span></div>
        <div class="p-text">${esc(p.text)}</div>
        <div class="post-actions">
          ${isMember?reactButtonsHTML(p,cu):''}
          <button class="link-btn" style="font-size:11.5px" onclick="toggleComments('${p.id}')">${comments.length?comments.length+' comentario'+(comments.length===1?'':'s'):'Comentar'}</button>
          ${isOwner?`<button class="link-btn" style="font-size:11.5px" onclick="startEditPost('${p.id}')">Editar</button>`:''}
          ${canManage?`<button class="link-btn" style="font-size:11.5px;color:#c9425e" onclick="deletePost('${p.id}')">Borrar</button>`:''}
          ${reportLink('post',p.id,p.authorId)}
          ${reactionSummaryHTML(p)}
        </div>
        ${commentsOpen?`
          ${comments.map(c=>commentHTML(c,cu,isAdmin)).join('')}
          ${isMember?`<form onsubmit="addComment(event,'${p.id}')" style="display:flex;gap:8px;margin-top:10px">
            ${avatarHTML(cu,26)}
            <input name="text" maxlength="300" placeholder="Escribí un comentario..." style="flex:1;padding:7px 10px;border:2px solid var(--ink);border-radius:14px;font-size:12.5px" required/>
            <button class="btn btn-sm btn-primary" type="submit" style="padding:6px 12px">Enviar</button>
          </form>`:''}
        `:''}
      </div></div>`;
  }).join(''):`<div class="empty-state"><p style="margin:0">Todavía no hay nada publicado en el muro.</p></div>`}
  `;
}

function renderMiembrosTab(g,cu,members,isAdmin){
  return members.map(u=>{
    const isSelf=u.id===cu.id;
    const userIsAdmin=g.admins.includes(u.id);
    return `<div class="member-row" style="flex-wrap:wrap;gap:10px">
      <div class="m-left" style="cursor:pointer" title="Ver perfil" onclick="openProfile('${u.id}')">${avatarHTML(u,38)}<div><div class="m-name">${esc(u.name)}${isSelf?' (vos)':''}${userIsAdmin?' <span class="tag tag-yellow" style="font-size:9px;padding:2px 6px;vertical-align:middle">ADMIN</span>':''}</div><div class="m-handle">${esc(u.handle)}</div></div></div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        ${!isSelf&&!isHiddenUser(u.id)?friendButtonHTML(cu,u):''}
        ${!isSelf?(state.blockedIds.includes(u.id)?`<button class="link-btn" style="font-size:11px" onclick="unblockUser('${u.id}')">Desbloquear</button>`:reportLink('user',u.id,u.id)):''}
        ${isAdmin&&!isSelf?`
          ${userIsAdmin?`<button class="link-btn" style="font-size:11px" onclick="demoteAdmin('${g.id}','${u.id}')">Sacar admin</button>`
                        :`<button class="link-btn" style="font-size:11px" onclick="promoteAdmin('${g.id}','${u.id}')">Hacer admin</button>`}
          <button class="link-btn" style="font-size:11px;color:#c9425e" onclick="removeMember('${g.id}','${u.id}')">Expulsar</button>
        `:''}
      </div>
    </div>`;
  }).join('');
}

/* ================= MASTER RENDER ================= */
function render(){
  const app=document.getElementById('app');
  if(state.loading){
    app.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:\'Space Mono\',monospace">Cargando Tablón…</div>';
    return;
  }
  if(state.loadError){
    app.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">'
      +'<div style="max-width:520px;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:6px;padding:28px 26px">'
      +'<h2 style="font-family:Anton,sans-serif;text-transform:none;margin:0 0 12px">No pudimos conectar con el servidor</h2>'
      +'<p style="margin:0 0 10px;line-height:1.5">'+esc(state.loadError)+'</p>'
      +'<p class="mono" style="font-size:12px;color:var(--text-faint);margin:0">Puede ser algo momentáneo. Si el problema sigue en unos minutos, probá más tarde.</p>'
      +'<button class="btn btn-dark btn-sm" style="margin-top:16px" onclick="location.reload()">Reintentar</button>'
      +'</div></div>';
    return;
  }
  // Si la sesión quedó apuntando a un usuario que ya no existe (por ejemplo,
  // se borró la cuenta desde la base), no rompemos la página: la tratamos
  // como si hubiera cerrado sesión.
  if(state.view==='app'&&!currentUser()){
    state.view='landing';
    state.currentUserId=null;
    apiCall('logout').catch(()=>{}); // limpiamos la cookie vieja del servidor, sin bloquear el render
  }

  const view=state.view;
  app.innerHTML=
    view==='landing'?renderLanding():
    view==='checkEmail'?renderCheckEmail():
    view==='forgotPassword'?renderForgotPassword():
    view==='resetSent'?renderResetSent():
    view==='resetPassword'?renderResetPassword():
    view==='onboarding'?renderOnboarding():
    renderApp();
  renderToasts();
  if(state.view==='landing')initReveal();
  window.scrollTo({top:document.body.scrollTop?0:window.scrollY});
  if(state.view==='app'){
    syncRoute();
    chatAfterRender();
    if(state.appView==='explorar')updateExploreGrid();
    if(state.highlightMeetupId){
      const id=state.highlightMeetupId;state.highlightMeetupId=null;
      setTimeout(()=>{const el=document.getElementById('meetup-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},60);
    }
  }else stopChat();
}

function initReveal(){
  const els=document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)||reduceMotion()){els.forEach(el=>el.classList.add('in'));return;}
  // Lo que ya está en pantalla aparece al toque; el resto, apenas asoma (sin esperar a que entre entero).
  const vh=window.innerHeight||800;
  const obs=new IntersectionObserver((entries)=>{
    entries.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');obs.unobserve(en.target);}});
  },{threshold:0,rootMargin:'0px 0px 80px 0px'});
  els.forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.top<vh)el.classList.add('in');else obs.observe(el);
  });
}

document.addEventListener('click', function(e){
  // Si el click ya re-dibujó la pantalla, el elemento tocado quedó afuera
  // del documento: en ese caso no hay "click afuera" que procesar.
  if(!document.body.contains(e.target))return;
  if(state.notifPanelOpen && !e.target.closest('.notif-bell') && !e.target.closest('.notif-panel')){
    closeNotifPanel();
    render();
  }
  let changed=false;
  if(state.profileMenuOpen && !e.target.closest('.profile-trigger') && !e.target.closest('.profile-menu')){
    state.profileMenuOpen=false;changed=true;
  }
  if(state.reactPickerPostId && !e.target.closest('.react-wrap')){
    state.reactPickerPostId=null;changed=true;
  }
  if(changed)render();
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'&&(state.profileMenuOpen||state.reactPickerPostId||state.reportModal||state.shareModal)){
    state.profileMenuOpen=false;state.reactPickerPostId=null;state.reportModal=null;state.shareModal=null;render();
    return;
  }
  // Calendario: flechas para moverse entre días
  if(state.view==='app'&&state.appView==='calendario'&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable)return;
    const step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
    if(step){e.preventDefault();calMoveSelection(step);}
  }
});

(async function init(){
  applyTheme();
  try{
    await loadBootstrap();
    state.loading=false;
    const resetToken=new URLSearchParams(location.search).get('reset');
    if(resetToken){
      state.resetToken=resetToken;
      state.view='resetPassword';
    }else{
      state.view=state.currentUserId?'app':'landing';
      // Entró por un link compartido (#/grupo/3, #/encuentro/9...)
      if(isAppRoute(location.hash)){
        if(state.currentUserId){_applyingRoute=true;applyRoute(location.hash);}
        else{state.pendingRoute=location.hash;state.authOpen=true;state.authTab='login';setTimeout(()=>addToast('Entrá (o probá la demo) para ver lo que te compartieron.'),300);}
      }
    }
  }catch(err){
    state.loading=false;
    state.loadError=err.message||'No pudimos conectar con el servidor.';
  }
  render();
  _applyingRoute=false;
})();
window.addEventListener('hashchange',()=>{
  if(state.view==='app'&&isAppRoute(location.hash)&&location.hash!==currentRoute()){
    _applyingRoute=true;if(applyRoute(location.hash))render();_applyingRoute=false;window.scrollTo(0,0);
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&chatActive())pollChat();});
</script>
