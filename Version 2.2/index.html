[data-theme="dark"] .rt-info{color:#bdc1c6;}[data-theme="dark"] .rt-info b{color:#81c995;}[data-theme="dark"] .rt-links a{color:#8ab4f8;}

  .mapx-tr{top:8px;right:8px;gap:6px;}

  .mapx-btn .lbl{display:none;}
  .mapx-route{left:8px;right:8px;bottom:8px;width:auto;max-width:none;}
  .rt-note{display:none;}

/* ================= API =================
   Toda la data real vive en MySQL y se accede a través de api/index.php.
   apiCall() manda la acción y devuelve la respuesta ya parseada como JSON.
   loadBootstrap() trae categorías + usuarios + grupos + sesión actual. */
async function apiCall(action,payload){
  const res=await fetch('api/index.php',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials:'same-origin',
    body:JSON.stringify(Object.assign({action},payload||{}))
  });
  let data;
  try{data=await res.json();}
  catch(e){throw new Error('El servidor no devolvió una respuesta válida.');}
  // Si te suspendieron mientras usabas la app, te saca y te explica por qué.
  if(data&&data.ok===false&&res.status===403&&/^Tu cuenta está suspendida/.test(data.error||'')&&state.currentUserId){showSuspended(data.error);state.currentUserId=null;state.view='landing';render();}
  return data;
}
async function loadBootstrap(){
  const data=await apiCall('bootstrap');
  if(!data.ok)throw new Error(data.error||'No se pudo cargar la información.');
  CATEGORIES=data.categories;
  state.users=data.users;
  state.groups=data.groups;
  state.currentUserId=data.currentUserId;
  state.incomingRequests=data.incomingRequests||[];
  state.outgoingRequests=data.outgoingRequests||[];
  state.notifications=data.notifications||[];
  state.unreadNotifications=data.unreadNotifications||0;
  state.blockedIds=data.blockedIds||[];
  state.hiddenUserIds=data.hiddenUserIds||[];
  state.isModerator=!!data.isModerator;
  state.siteRole=data.siteRole||'user';
  if(data.suspendedMsg)setTimeout(()=>showSuspended(data.suspendedMsg),200);
  state.openReports=data.openReports||0;
  if(state.currentUserId)checkNewStickers();
}

/* ================= HELPERS v2 ================= */
function plural(n,sing,plu){return n+' '+(n===1?sing:(plu||sing+'s'));}

const DIAS_CORTOS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
/* La fecha de un encuentro, siempre con el mismo formato: "Jue 10/09 · 21:11" */
function meetupWhen(m){
  if(!m.eventDate)return m.date||'';
  const d=parseYmd(m.eventDate);
  return DIAS_CORTOS[d.getDay()]+' '+pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+' · '+(m.eventTime||'');
}
function meetupKey(m){return (m.eventDate||'9999-99-99')+' '+(m.eventTime||'99:99');}
function upcomingOf(g){return g.meetups.filter(m=>m.eventDate&&!isMeetupPast(m)).sort((a,b)=>meetupKey(a)<meetupKey(b)?-1:1);}
function pastOf(g){return g.meetups.filter(m=>!m.eventDate||isMeetupPast(m)).sort((a,b)=>meetupKey(a)<meetupKey(b)?1:-1);}
function nextMeetup(g){return upcomingOf(g)[0]||null;}
function allUpcoming(){
  const out=[];
  state.groups.forEach(g=>upcomingOf(g).forEach(m=>out.push({g,m})));
  return out.sort((a,b)=>meetupKey(a.m)<meetupKey(b.m)?-1:1);
}

function normTxt(s){return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
const _coordCache={};
function zoneInfo(zone){
  const z=normTxt(zone);
  if(z in _coordCache)return _coordCache[z];
  let hit=null;
  for(const p of PLACES){if(z.includes(p[0])){hit={lat:p[1],lng:p[2],barrio:p[3]};break;}}
  return _coordCache[z]=hit;
}
function distanceKm(a,b){
  const R=6371,toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function groupDistance(g){
  if(!myPos)return null;
  const zi=zoneInfo(g.zone);
  return zi?distanceKm(myPos,zi):null;
}

/* ================= LINKS PARA COMPARTIR (rutas con #) =================
   Cada pantalla tiene su dirección: #/grupo/3, #/grupo/3/chat,
   #/encuentro/9, #/perfil/14, #/explorar... Así se puede mandar por
   WhatsApp y el botón "atrás" del celu funciona. */
let _applyingRoute=false;
function currentRoute(){
  if(state.view!=='app')return null;
  const v=state.appView;
  if(v==='grupo'&&state.activeGroupId)return '#/grupo/'+state.activeGroupId+(state.groupTab&&state.groupTab!=='encuentros'?'/'+state.groupTab:'');
  if(v==='perfil')return '#/perfil/'+(state.profileUserId||state.currentUserId);
  const map={inicio:'#/inicio',explorar:'#/explorar',misgrupos:'#/mis-grupos',calendario:'#/calendario',amigos:'#/amigos',crear:'#/crear',moderacion:'#/moderacion'};
  return map[v]||'#/inicio';
}
function syncRoute(){
  const r=currentRoute();
  if(!r||location.hash===r)return;
  try{
    if(_applyingRoute)history.replaceState(null,'',r);
    else history.pushState(null,'',r);
  }catch(e){}
}
function isAppRoute(h){return /^#\/(grupo|encuentro|perfil|inicio|explorar|mis-grupos|calendario|amigos|crear|moderacion)/.test(h||'');}
/* Aplica una ruta. Devuelve false si no la pudo resolver. */
function applyRoute(h){
  const parts=(h||'').replace(/^#\/?/,'').split('/');
  const kind=parts[0],id=parts[1],sub=parts[2];
  state.profileMenuOpen=false;state.notifPanelOpen=false;state.meetupFormOpen=false;
  if(kind==='grupo'&&getGroup(id)){
    state.appView='grupo';state.activeGroupId=id;
    state.groupTab=['encuentros','chat','muro','miembros','denuncias'].includes(sub)?sub:'encuentros';
    return true;
  }
  if(kind==='encuentro'){
    const g=state.groups.find(g=>g.meetups.some(m=>m.id===id));
    if(!g)return false;
    const m=g.meetups.find(m=>m.id===id);
    state.appView='grupo';state.activeGroupId=g.id;state.groupTab='encuentros';
    state.highlightMeetupId=id;
    if(m&&(isMeetupPast(m)||!m.eventDate))state.showPastMeetups=true;
    return true;
  }
  if(kind==='perfil'&&getUser(id)){state.appView='perfil';state.profileUserId=id;state.profileCats=null;return true;}
  const map={inicio:'inicio',explorar:'explorar','mis-grupos':'misgrupos',calendario:'calendario',amigos:'amigos',crear:'crear',moderacion:'moderacion'};
  if(map[kind]){state.appView=map[kind];if(map[kind]!=='grupo')state.activeGroupId=null;return true;}
  return false;
}
window.addEventListener('popstate',()=>{
  if(state.view!=='app'){
    if(isAppRoute(location.hash)&&!state.currentUserId){state.pendingRoute=location.hash;openAuth('login');}
    return;
  }
  if(!isAppRoute(location.hash))return;
  _applyingRoute=true;
  if(applyRoute(location.hash))render();
  _applyingRoute=false;
  window.scrollTo(0,0);
});
/* Después de entrar (login o demo): si veníamos de un link compartido, vamos ahí. */
function goToPendingRoute(){
  const r=state.pendingRoute;state.pendingRoute=null;
  if(r&&applyRoute(r))return true;
  return false;
}

function shareMeetup(gid,mid){
  const g=getGroup(gid),m=g&&g.meetups.find(x=>x.id===mid);if(!m)return;
  openShare(linkFor('#/encuentro/'+mid),m.title,'¿Venís? "'+m.title+'" — '+meetupWhen(m)+' en '+placeShort(m)+' ('+g.name+', Tablón)');

async function openShare(url,title,text){
  playSound('open');
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){
    try{await navigator.share({title,text,url});return;}catch(e){if(e&&e.name==='AbortError')return;}
  }
  state.shareModal={url,title,text};render();
}
function closeShare(){state.shareModal=null;render();}
async function copyShareLink(){
  const u=state.shareModal&&state.shareModal.url;if(!u)return;
  try{await navigator.clipboard.writeText(u);addToast('Link copiado.');}
  catch(e){const i=document.getElementById('shareUrl');if(i){i.select();document.execCommand('copy');addToast('Link copiado.');}}
}
function renderShareModal(){
  const s=state.shareModal;if(!s)return '';
  const wa='https://wa.me/?text='+encodeURIComponent(s.text+' '+s.url);
  return `<div class="overlay" onmousedown="if(event.target===this)closeShare()">
    <div class="modal-card">
      <button class="auth-close" onclick="closeShare()">${ICONS.close}</button>
      <h3>Compartir</h3>
      <p class="card-sub">Cualquiera con este link puede ver ${esc(s.title)} después de entrar a Tablón.</p>
      <input class="share-url" id="shareUrl" value="${esc(s.url)}" readonly onclick="this.select()"/>
      <div class="share-row">
        <button class="btn btn-sm btn-primary" onclick="copyShareLink()">Copiar link</button>
        <a class="btn btn-sm btn-dark" style="text-decoration:none" href="${esc(wa)}" target="_blank" rel="noopener">Mandar por WhatsApp</a>
      </div>
    </div>
  </div>`;
}

/* ================= CALENDARIO DE GOOGLE ================= */
function googleCalUrl(g,m){
  if(!m.eventDate)return null;
  const start=m.eventDate.replace(/-/g,'')+'T'+(m.eventTime||'00:00').replace(':','')+'00';
  const d=parseYmd(m.eventDate);const hm=(m.eventTime||'00:00').split(':').map(Number);
  d.setHours(hm[0]+2,hm[1],0,0);
  const end=d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'T'+pad2(d.getHours())+pad2(d.getMinutes())+'00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent(m.title+' · '+g.name)
    +'&dates='+start+'/'+end
    +'&ctz=America/Argentina/Buenos_Aires'
    +'&location='+encodeURIComponent(m.placeHidden?placeShort(m):m.place)
    +'&details='+encodeURIComponent('Encuentro de '+g.name+' en Tablón: '+linkFor('#/encuentro/'+m.id));
}

/* ================= CHAT DEL GRUPO =================
   Se pregunta al servidor cada 4 segundos si hay mensajes nuevos, solo
   mientras la pestaña Chat está abierta (así no gasta datos de más). */
const chat={groupId:null,messages:[],lastId:0,timer:null,loaded:false,busy:false};
function chatActive(){return state.view==='app'&&state.appView==='grupo'&&state.groupTab==='chat'&&state.activeGroupId;}
function stopChat(){if(chat.timer){clearInterval(chat.timer);chat.timer=null;}}
async function pollChat(){
  if(!chatActive()){stopChat();return;}
  if(chat.busy||document.hidden)return;
  chat.busy=true;
  const gid=chat.groupId;
  try{
    const res=await apiCall('get_messages',{groupId:gid,afterId:chat.loaded?chat.lastId:0});
    if(res.ok&&gid===chat.groupId){
      const known=new Set(chat.messages.map(m=>m.id));
      res.messages.forEach(m=>{if(!known.has(m.id))chat.messages.push(m);});
      if(chat.messages.length)chat.lastId=Math.max(...chat.messages.map(m=>+m.id));
      chat.loaded=true;
      paintChat();
    }
  }catch(e){}
  chat.busy=false;
}
function chatAfterRender(){
  if(!chatActive()){stopChat();return;}
  if(chat.groupId!==state.activeGroupId){chat.groupId=state.activeGroupId;chat.messages=[];chat.lastId=0;chat.loaded=false;}
  paintChat(true);
  if(!chat.timer){pollChat();chat.timer=setInterval(pollChat,4000);}
}
function chatTime(ms){const d=new Date(ms);return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function chatDay(ms){
  const d=new Date(ms),t=new Date();
  const k=x=>x.getFullYear()+'-'+x.getMonth()+'-'+x.getDate();
  if(k(d)===k(t))return 'Hoy';
  const y=new Date();y.setDate(y.getDate()-1);
  if(k(d)===k(y))return 'Ayer';
  return DIAS_CORTOS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()];
}
function paintChat(forceBottom){
  const list=document.getElementById('chatList');if(!list)return;
  const nearBottom=forceBottom||list.scrollHeight-list.scrollTop-list.clientHeight<80;
  const g=getGroup(chat.groupId),cu=currentUser();
  const isAdmin=g&&cu&&g.admins.includes(cu.id);
  const msgs=chat.messages.filter(m=>!isHiddenUser(m.authorId));
  if(!chat.loaded){list.innerHTML=skeletonHTML(3);return;}
  if(!msgs.length){list.innerHTML='<div class="chat-empty">Todavía no hay mensajes. ¡Arrancá la charla! Ideal para coordinar el próximo encuentro.</div>';return;}
  let lastDay='';
  list.innerHTML=msgs.map(m=>{
    const u=getUser(m.authorId),me=m.authorId===cu.id;
    const day=chatDay(m.at);
    const sep=day!==lastDay?`<div class="chat-day">${esc(day)}</div>`:'';lastDay=day;
    return sep+`<div class="chat-msg ${me?'me':''}">
      ${me?'':(u?`<button class="user-link" onclick="openProfile('${u.id}')">${avatarHTML(u,28)}</button>`:avatarHTML({name:'?',colorIdx:0},28))}
      <div style="min-width:0">
        <div class="chat-meta">${me?'':`<b>${esc(u?u.name.split(' ')[0]:'Alguien')}</b>`}<span>${chatTime(m.at)}</span>
          ${me||isAdmin||state.isModerator?`<button class="link-btn" onclick="deleteChatMessage('${m.id}')">borrar</button>`:''}
          ${!me?`<button class="link-btn" onclick="openReport('message','${m.id}',${m.authorId?`'${m.authorId}'`:'null'})">denunciar</button>`:''}
        </div>
        <div class="chat-bubble">${esc(m.text)}</div>
      </div>
    </div>`;
  }).join('');
  if(nearBottom)list.scrollTop=list.scrollHeight;
}
async function sendChatMessage(e){
  e.preventDefault();
  const inp=e.target.text,text=inp.value.trim();
  if(!text)return;
  inp.value='';
  try{
    const res=await apiCall('send_message',{groupId:chat.groupId,text});
    if(!res.ok){addToast(res.error||'No pudimos mandar el mensaje.');inp.value=text;return;}
    playSound('pop');
    await pollChat();
    const list=document.getElementById('chatList');if(list)list.scrollTop=list.scrollHeight;
  }catch(err){addToast('No pudimos conectar con el servidor.');inp.value=text;}
  inp.focus();
}
async function deleteChatMessage(mid){
  if(!confirm('¿Borrar este mensaje?'))return;
  const res=await apiCall('delete_message',{messageId:mid});
  if(!res.ok){addToast(res.error||'No pudimos borrar el mensaje.');return;}
  chat.messages=chat.messages.filter(m=>m.id!==mid);
  paintChat();
}
function renderChatTab(g,cu,isMember){
  if(!isMember&&state.isModerator)return `<div class="mod-banner">${ICONS.eye} Estás viendo este chat como <b>moderación</b>. Solo lectura: podés borrar mensajes y denunciar, pero no escribir.</div>

  if(!isMember)return `<div class="empty-state"><p style="margin:0">Unite al grupo para leer y escribir en el chat.</p></div>`;
  return `<div class="chat-box">

    <form class="chat-form" onsubmit="sendChatMessage(event)">

}

function recommendGroups(cu,limit){
  const myZone=zoneInfo(cu.zone);
  return state.groups
    .filter(g=>!g.members.includes(cu.id)&&!isIdle(g))
    .map(g=>{
      let score=0;const why=[];
      if(cu.categories.includes(g.categoryId)){score+=3;why.push('Te gusta '+catLabel(g.categoryId));}
      const zi=zoneInfo(g.zone);
      if(myZone&&zi&&zi.barrio===myZone.barrio){score+=2;why.push('En tu barrio');}
      else if(myZone&&zi&&distanceKm(myZone,zi)<4){score+=1;why.push('Cerca tuyo');}
      const fr=g.members.filter(id=>cu.friends.includes(id)).length;
      if(fr){score+=fr;why.push(plural(fr,'amigo está','amigos están'));}
      const nx=nextMeetup(g);
      if(nx){score+=1;if(nx.level==='principiante'){score+=1;why.push('Ideal primera vez');}}
      return {g,score,why};
    })
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score||b.g.members.length-a.g.members.length)
    .slice(0,limit||4);
}
function recommendedCardHTML(x){
  return groupCardHTML(x.g,x.why.slice(0,2).join(' · '));

/* número chiquito y estable a partir de un texto (para inclinar notas y polaroids siempre igual) */
function hashNum(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return Math.abs(h);}
function tilt(seed,max){return ((hashNum(seed)%(max*20+1))/10-max).toFixed(1);}
const CAT_HEX={pink:'#ff3d6e',blue:'#5169ff',yellow:'#f6df3f',green:'#38c98d',orange:'#ff8a3d'};
const NOTE_PAPER={pink:'#ffd6e0',blue:'#d9defe',yellow:'#fff3a8',green:'#cdf3e1',orange:'#ffe0c7'};

/* ================= 1) TICKET COLECCIONABLE ================= */
function wrapLines(ctx,text,maxW){
  const words=String(text).split(/\s+/);const lines=[];let line='';
  words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);return lines;
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
async function makeTicketCanvas(g,m,cu){
  try{await Promise.all(['80px Anton','600 40px "Space Grotesk"','700 30px "Space Mono"','600 40px Caveat'].map(f=>document.fonts.load(f)));}catch(e){}
  const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  const col=CAT_HEX[catColorName(g.categoryId)]||'#ff3d6e';
  const ink='#14161f',paper='#f1ecdd';
  // fondo con puntitos
  x.fillStyle=ink;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(242,239,228,0.08)';
  for(let yy=12;yy<H;yy+=32)for(let xx=12;xx<W;xx+=32){x.beginPath();x.arc(xx,yy,2,0,7);x.fill();}
  // marca
  x.fillStyle='#ff3d6e';x.beginPath();x.arc(98,128,13,0,7);x.fill();
  x.fillStyle=paper;x.font='64px Anton';x.textBaseline='middle';x.fillText('TABLÓN',126,130);
  x.font='700 26px "Space Mono"';x.fillStyle='#f6df3f';x.textAlign='right';x.fillText('PASE PARA UN ENCUENTRO',W-84,130);x.textAlign='left';
  // ticket
  const tx=84,ty=230,tw=W-168,th=1500,cut=1130;
  x.save();x.translate(W/2,ty+th/2);x.rotate(-0.012);x.translate(-W/2,-(ty+th/2));
  x.shadowColor='rgba(0,0,0,0.45)';x.shadowBlur=50;x.shadowOffsetY=24;
  roundRect(x,tx,ty,tw,th,26);x.fillStyle=paper;x.fill();
  x.shadowColor='transparent';
  // banda de color
  x.save();roundRect(x,tx,ty,tw,th,26);x.clip();
  x.fillStyle=col;x.fillRect(tx,ty,tw,150);
  x.restore();
  x.fillStyle=(col==='#f6df3f'||col==='#38c98d'||col==='#ff8a3d')?ink:'#fff';
  x.font='700 32px "Space Mono"';x.fillText(catLabel(g.categoryId).toUpperCase(),tx+56,ty+76);
  x.textAlign='right';x.fillText('Nº '+String(m.id).padStart(4,'0'),tx+tw-56,ty+76);x.textAlign='left';
  // título
  x.fillStyle=ink;x.font='108px Anton';x.textBaseline='alphabetic';
  let yy=ty+290;
  wrapLines(x,m.title.toUpperCase(),tw-112).slice(0,3).forEach(l=>{x.fillText(l,tx+56,yy);yy+=112;});
  x.font='600 38px "Space Grotesk"';x.fillStyle='#4b4d5c';x.fillText(g.name,tx+56,yy-20);
  // datos
  const d=m.eventDate?parseYmd(m.eventDate):null;
  const fields=[
    ['FECHA',d?capFirst(DIAS_LARGOS[d.getDay()])+' '+d.getDate()+' de '+MESES[d.getMonth()]:(m.date||'')],
    ['HORA',(m.eventTime||'--:--')+' hs'],
    ['ZONA',(()=>{const zi=zoneInfo(g.zone);return zi?zi.barrio:(g.zone||'');})()],  // el ticket se comparte en redes: nunca el lugar exacto
    ['NIVEL',LEVELS[m.level||'todos']||'Todos los niveles']
  ];
  let fy=yy+70;
  fields.forEach(([k,v],i)=>{
    const col2=i%2,row=Math.floor(i/2);const fx=tx+56+col2*((tw-112)/2),fyy=fy+row*170;
    x.font='700 26px "Space Mono"';x.fillStyle='#8b8e9e';x.fillText(k,fx,fyy);
    x.font='600 44px "Space Grotesk"';x.fillStyle=ink;
    wrapLines(x,v,(tw-150)/2).slice(0,2).forEach((l,j)=>x.fillText(l,fx,fyy+56+j*50));
  });
  // perforado
  const py=ty+cut;
  x.fillStyle=ink;x.beginPath();x.arc(tx,py,36,0,7);x.fill();x.beginPath();x.arc(tx+tw,py,36,0,7);x.fill();
  x.strokeStyle='#b9b3a0';x.lineWidth=5;x.setLineDash([18,16]);x.beginPath();x.moveTo(tx+52,py);x.lineTo(tx+tw-52,py);x.stroke();x.setLineDash([]);
  // talón
  const pos=Math.max(1,m.going.indexOf(cu.id)+1);
  x.font='700 28px "Space Mono"';x.fillStyle='#8b8e9e';x.fillText('A NOMBRE DE',tx+56,py+90);
  x.font='600 46px "Space Grotesk"';x.fillStyle=ink;x.fillText(cu.name,tx+56,py+148);
  x.font='700 28px "Space Mono"';x.fillStyle='#8b8e9e';x.fillText(m.capacity!=null?('CUPO '+m.going.length+'/'+m.capacity):(m.going.length+' ANOTADES'),tx+56,py+214);
  x.textAlign='right';x.font='700 28px "Space Mono"';x.fillStyle='#8b8e9e';x.fillText('SOS EL',tx+tw-56,py+90);
  x.font='190px Anton';x.fillStyle='#ff3d6e';x.fillText('#'+pos,tx+tw-56,py+270);x.textAlign='left';
  // código de barras (de mentira, sale del id)
  let bx=tx+56;const by=py+270,bh=70;const seed=hashNum('tablon'+m.id+cu.id);
  for(let i=0;i<46&&bx<tx+520;i++){const w=2+((seed>>((i*3)%28))&3)*2;x.fillStyle=ink;if(i%2===0)x.fillRect(bx,by,w,bh);bx+=w+3;}
  // sello
  x.save();x.translate(tx+tw-210,ty+cut-150);x.rotate(-0.25);
  x.strokeStyle='#38c98d';x.lineWidth=8;x.beginPath();x.arc(0,0,92,0,7);x.stroke();
  x.lineWidth=3;x.beginPath();x.arc(0,0,76,0,7);x.stroke();
  x.fillStyle='#38c98d';x.font='64px Anton';x.textAlign='center';x.textBaseline='middle';x.fillText('VOY',0,4);
  x.restore();
  x.restore();
  // pie
  x.textBaseline='alphabetic';x.textAlign='center';
  x.fillStyle=paper;x.font='600 56px Caveat';x.fillText('nos vemos ahí ✦',W/2,H-118);
  x.font='700 26px "Space Mono"';x.fillStyle='rgba(242,239,228,0.6)';x.fillText(location.host.toUpperCase()+' · EL CORCHO DIGITAL DE TU CIUDAD',W/2,H-62);
  x.textAlign='left';
  return c;
}

/* Recuerdos para compartir: arma una polaroid 1080×1350 (formato post de Instagram)
   con la foto, el nombre del encuentro y la fecha. Nunca incluye el lugar exacto. */
async function makePolaroidCanvas(l){
  try{await Promise.all(['600 64px Caveat','700 26px "Space Mono"','56px Anton'].map(f=>document.fonts.load(f)));}catch(e){}
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=l.src;});
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');const ink='#14161f',paper='#f1ecdd';
  // fondo de corcho oscuro con puntitos
  x.fillStyle='#1b1d29';x.fillRect(0,0,W,H);
  x.fillStyle='rgba(242,239,228,0.07)';
  for(let yy=14;yy<H;yy+=30)for(let xx=14;xx<W;xx+=30){x.beginPath();x.arc(xx,yy,2,0,7);x.fill();}
  // la polaroid, apenas inclinada
  const PAD=44,S=772,PW=S+PAD*2,PH=PAD+S+200;
  x.save();x.translate(W/2,H/2-30);x.rotate(-2*Math.PI/180);
  x.shadowColor='rgba(0,0,0,.55)';x.shadowBlur=50;x.shadowOffsetY=22;
  x.fillStyle='#fbf8ef';x.fillRect(-PW/2,-PH/2,PW,PH);
  x.shadowColor='transparent';
  // foto recortada al cuadrado (tipo "cover")
  const sc=Math.max(S/img.width,S/img.height),sw=S/sc,sh=S/sc;
  x.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,-PW/2+PAD,-PH/2+PAD,S,S);
  x.strokeStyle='rgba(20,22,31,.12)';x.lineWidth=2;x.strokeRect(-PW/2+PAD,-PH/2+PAD,S,S);
  // texto escrito a mano
  x.fillStyle=ink;x.textAlign='center';x.textBaseline='alphabetic';
  let t=l.title;x.font='600 70px Caveat';while(x.measureText(t).width>S-20&&t.length>4)t=t.slice(0,-2);
  if(t!==l.title)t=t.replace(/\s*\S?$/,'')+'…';
  x.fillText(t,0,-PH/2+PAD+S+100);
  x.fillStyle='#6b6d7c';x.font='700 26px "Space Mono"';
  x.fillText([l.date,l.group].filter(Boolean).join('  ·  '),0,-PH/2+PAD+S+152);
  // cinta arriba
  x.save();x.translate(0,-PH/2+4);x.rotate(3*Math.PI/180);
  x.fillStyle='rgba(246,223,63,.78)';x.fillRect(-95,-26,190,52);x.restore();
  x.restore();
  // marca abajo
  x.textAlign='center';x.textBaseline='middle';
  x.font='48px Anton';const bw=x.measureText('TABLÓN').width;
  x.fillStyle='#ff3d6e';x.beginPath();x.arc(W/2-bw/2-22,H-74,10,0,7);x.fill();
  x.fillStyle=paper;x.fillText('TABLÓN',W/2+8,H-72);
  x.fillStyle='rgba(242,239,228,.55)';x.font='700 20px "Space Mono"';
  x.fillText('el corcho digital de tu ciudad',W/2,H-32);
  return c;
}

function downloadBlob(blob,name){

  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);

async function sharePolaroid(btn){

/* ---------- Tu ubicación en el mapa (como Google Maps) ----------
   El puntito azul se calcula en tu celu/compu y NUNCA se manda al servidor. */
let _meWatch=null,_meMarker=null,_meAcc=null,_meAccuracy=null,_meFirstFix=false;
function drawMe(){
  if(!_map||!myPos)return;
  const ll=[myPos.lat,myPos.lng];
  if(!_meMarker||_meMarker._tabMap!==_map){
    try{if(_meMarker)_meMarker.remove();if(_meAcc)_meAcc.remove();}catch(e){}
    _meAcc=L.circle(ll,{radius:_meAccuracy||40,color:'#1a73e8',weight:1,opacity:.5,fillColor:'#1a73e8',fillOpacity:.12,interactive:false}).addTo(_map);
    _meMarker=L.marker(ll,{icon:meIcon(),zIndexOffset:1000,keyboard:false}).bindPopup('<b>Vos estás acá</b><br><small>Tu ubicación no se guarda ni se comparte.</small>').addTo(_map);
    _meMarker._tabMap=_map;
  }else{_meMarker.setLatLng(ll);_meAcc.setLatLng(ll);}
  _meAcc.setRadius(Math.min(_meAccuracy||40,1500));
}
function stopLocate(){
  if(_meWatch!==null){try{navigator.geolocation.clearWatch(_meWatch);}catch(e){}_meWatch=null;}
  document.querySelectorAll('.map-locate').forEach(b=>b.classList.remove('on','busy'));
}
function locateMe(){
  if(!navigator.geolocation){addToast('Tu navegador no permite ubicar dónde estás.');return;}
  const btn=document.querySelector('.map-locate');
  if(_meWatch!==null&&myPos&&_map){_map.setView([myPos.lat,myPos.lng],Math.max(_map.getZoom(),15));if(_meMarker)_meMarker.openPopup();return;}
  if(btn)btn.classList.add('busy');
  _meFirstFix=true;
  _meWatch=navigator.geolocation.watchPosition(pos=>{
    if(!_map||!document.body.contains(_map.getContainer())){stopLocate();return;}
    myPos={lat:pos.coords.latitude,lng:pos.coords.longitude};_meAccuracy=pos.coords.accuracy;
    drawMe();
    document.querySelectorAll('.map-locate').forEach(b=>{b.classList.remove('busy');b.classList.add('on');});
    if(_meFirstFix){_meFirstFix=false;_map.setView([myPos.lat,myPos.lng],Math.max(_map.getZoom(),15));}
  },err=>{
    stopLocate();
    addToast(err&&err.code===1?'Para ver dónde estás, permití la ubicación en el navegador (el candadito al lado de la dirección).':'No pudimos encontrar tu ubicación. Probá de nuevo en un ratito.');
  },{enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}
function addLocateControl(map){
  const Ctl=L.Control.extend({options:{position:'bottomright'},onAdd(){
    const b=L.DomUtil.create('button','map-locate'+(_meWatch!==null?' on':''));
    b.type='button';b.title='Mostrar dónde estoy';b.setAttribute('aria-label','Mostrar dónde estoy');b.innerHTML=ICONS.locate;
    L.DomEvent.disableClickPropagation(b);
    L.DomEvent.on(b,'click',e=>{L.DomEvent.preventDefault(e);locateMe();});
    return b;}});
  new Ctl().addTo(map);
}

function confettiRain(n){

  const colors=['#ff3d6e','#5169ff','#f6df3f','#38c98d','#ff8a3d','#b98cff','#4ccfe0'];
  const count=n||90;
  for(let i=0;i<count;i++){
    const p=document.createElement('i');
    p.style.left=(Math.random()*100)+'vw';
    p.style.background=colors[i%colors.length];
    p.style.setProperty('--d',(1.6+Math.random()*1.6).toFixed(2)+'s');
    p.style.setProperty('--delay',(Math.random()*0.5).toFixed(2)+'s');
    p.style.setProperty('--x',((Math.random()-0.5)*160).toFixed(0)+'px');
    p.style.setProperty('--rot',(Math.random()*900-450).toFixed(0)+'deg');
    if(i%3===0)p.style.borderRadius='50%';
    if(i%4===1){p.style.width='5px';p.style.height='14px';}
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(),3800);
}

      <span class="mini-disc" style="--c:${b.color}"><svg viewBox="0 0 48 48" aria-hidden="true">${STICKER_ART[b.art]}</svg></span>
      <div style="flex:1"><div>Desbloqueaste el sticker <b>${esc(b.label)}</b> ${ICONS.party}</div><div class="notif-time mono">${agoLabel(x.at)} · tocá para verlo de nuevo</div></div>
    </div>`;}).join('')}`;
}

/* ================= FASE 7: TABLÓN VERDE =================
   Datos abiertos de la Ciudad (data.buenosaires.gob.ar): plazas y parques,
   estaciones de Ecobici, estaciones de subte y Puntos Verdes. Están
   preprocesados en data/verde.json (~65 KB) y se cargan solo cuando hacen falta. */
let VERDE=null,_verdeP=null;
function loadVerde(){
  if(VERDE)return Promise.resolve(VERDE);
  if(!_verdeP)_verdeP=fetch('data/verde.json').then(r=>{if(!r.ok)throw new Error('verde');return r.json();}).then(d=>{
    d.ev.forEach(e=>{e.lat=e.c[0]/1e5;e.lng=e.c[1]/1e5;e.key=normTxt(e.n);});
    VERDE=d;return d;
  }).catch(e=>{_verdeP=null;throw e;});
  return _verdeP;
}
/* Si los datos todavía no están, los pide y vuelve a dibujar cuando llegan */
function verdeOrLoad(){if(VERDE)return VERDE;loadVerde().then(()=>render()).catch(()=>{});return null;}
const EV_TYPE={pz:'Plaza',pq:'Parque',pl:'Plazoleta',ps:'Paseo',jb:'Jardín Botánico',jd:'Jardín'};
function evRing(e){const pts=[];let y=e.c[0],x=e.c[1];for(let i=0;i<e.r.length;i+=2){y+=e.r[i];x+=e.r[i+1];pts.push([y/1e5,x/1e5]);}return pts;}
function fmtDist(km){return km<1?Math.round(km*1000/10)*10+' m':km.toFixed(1).replace('.',',')+' km';}

/* ¿El encuentro es al aire libre? El servidor lo calcula (así funciona aunque
   el lugar exacto esté oculto); si no vino, lo deducimos del texto. */
const OUTDOOR_RE=/\b(plaza|plazoleta|parque|reserva|jard[ií]n|bosques?|costanera|rosedal|paseo|lago|ecoparque|bot[aá]nico|sendero|huerta)\b/i;
function isOutdoor(m){return m.outdoor===true||(!!m.place&&OUTDOOR_RE.test(m.place));}
/* Busca el espacio verde que nombra el lugar ("Parque Centenario, Caballito") */
function greenSpaceFor(text){
  const V=VERDE;if(!V||!text)return null;
  const t=normTxt(text);let best=null;
  for(const e of V.ev){if(e.key.length>=6&&t.includes(e.key)&&(!best||e.key.length>best.key.length))best=e;}
  if(best)return best;
  const first=normTxt(text.split(',')[0]).trim();
  if(first.length>=6)for(const e of V.ev){if(e.key.includes(first)&&(!best||e.a>best.a))best=e;}
  return best;
}
function meetupCoords(g,m){
  const gs=m.place?greenSpaceFor(m.place):null;
  if(gs)return {lat:gs.lat,lng:gs.lng,exact:true};
  const zi=(m.place&&zoneInfo(m.place))||zoneInfo(g.zone);
  return zi?{lat:zi.lat,lng:zi.lng,exact:false}:null;
}

/* ---------- Check-in "📍 Estoy acá": prueba de que fuiste ----------
   Se puede desde 30 min antes hasta 4 h después de que empieza. Tu ubicación se compara
   con la del lugar acá mismo, en tu celu: al servidor solo le llega la distancia. */
function checkinOpen(m){
  if(!m.eventDate||!m.eventTime)return false;
  const st=new Date(m.eventDate+'T'+m.eventTime+':00-03:00').getTime(),now=Date.now(); // hora de Buenos Aires
  return now>=st-30*60000&&now<=st+4*3600000;
}
function checkinBtnHTML(g,m,cu){
  if(!cu||!m.going.includes(cu.id))return '';
  if((m.checkins||[]).includes(cu.id))return '<span class="mini-badge fill checkin-ok">'+ICONS.pin+' Llegaste</span>';
  return checkinOpen(m)?`<button class="btn btn-sm btn-primary" style="background:#1a73e8" onclick="doCheckin('${g.id}','${m.id}',this)">${ICONS.pin} Estoy acá</button>`:'';
}
async function doCheckin(gid,mid,btn){
  const g=getGroup(gid),m=g&&g.meetups.find(x=>x.id===mid);if(!m)return;
  if(!navigator.geolocation){addToast('Tu navegador no permite ubicar dónde estás.');return;}
  const btnHTML=btn?btn.innerHTML:'';
  if(btn){btn.disabled=true;btn.textContent='Buscando dónde estás…';}
  const reset=()=>{if(btn){btn.disabled=false;btn.innerHTML=btnHTML;}};
  const pt=await exactCoords(g,m);
  if(!pt){reset();addToast('No sabemos dónde queda este lugar, así que no podemos confirmar con GPS. Después tocá «Fui».');return;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const me={lat:pos.coords.latitude,lng:pos.coords.longitude},acc=Math.min(pos.coords.accuracy||0,150);
    const d=Math.round(distanceKm(me,pt)*1000);
    // Si el lugar es una plaza/parque conocido medimos fino (300 m); si solo sabemos el barrio, 1,5 km.
    const lim=(pt.exact?300:1500)+acc;
    if(d>lim){reset();addToast('Parece que todavía no estás ahí (estás a '+(d>=1000?(d/1000).toFixed(1).replace('.',',')+' km':d+' m')+'). Probá cuando llegues.');return;}
    try{
      const res=await apiCall('checkin',{meetupId:mid,dist:d});
      if(!res.ok){reset();addToast(res.error||'No pudimos registrar que llegaste.');return;}
      m.checkins=(m.checkins||[]).concat(state.currentUserId);
      playSound('going');burstAt(btn);
      addToast('¡Llegaste! Quedó confirmado que fuiste.');
      render();checkNewStickers();
    }catch(e){reset();addToast('No pudimos conectarnos. Probá de nuevo.');}
  },err=>{reset();addToast(err&&err.code===1?'Para confirmar que estás ahí, permití la ubicación en el navegador.':'No pudimos encontrar tu ubicación. Probá de nuevo.');},
  {enableHighAccuracy:true,maximumAge:0,timeout:20000});
}

/* ---------- 1) Lugares verdes sugeridos al proponer un encuentro ---------- */
function nearbyGreens(pt,n){
  const V=VERDE;if(!V||!pt)return [];
  return V.ev.map(e=>{const d=distanceKm(pt,e);return {e,d,score:d-Math.min(1.2,Math.log10(e.a)/4)};})
    .filter(x=>x.d<3.5).sort((a,b)=>a.score-b.score).slice(0,n||6);
}
function greenSuggestHTML(){
  const g=getGroup(state.activeGroupId);if(!g)return '';
  return `<div class="green-suggest" id="greenSuggest" data-gid="${g.id}">
    <div class="gs-head">${ICONS.leaf}<b>Lugares verdes cerca de ${esc(g.zone)}</b><span>Plazas y parques públicos: lugares abiertos y a la vista, ideales para juntarse.</span></div>
    <div class="gs-chips"><span class="skel" style="height:30px;width:60%"></span></div>
  </div>`;
}
function fillGreenSuggest(){
  const box=document.getElementById('greenSuggest');if(!box||box.dataset.done)return;
  loadVerde().then(()=>{
    const g=getGroup(box.dataset.gid);const zi=g&&zoneInfo(g.zone);
    const list=nearbyGreens(zi?{lat:zi.lat,lng:zi.lng}:{lat:-34.605,lng:-58.43},6);
    box.dataset.done='1';
    const chips=box.querySelector('.gs-chips');if(!chips)return;
    chips.innerHTML=list.length?list.map(({e,d})=>`<button type="button" class="gs-chip" onclick="pickGreen(this)" data-v="${esc(e.n+', '+e.b)}" title="${esc(EV_TYPE[e.t]||'')} · ${esc(e.b)}">
        <span class="gs-dot t-${e.t}"></span>${esc(e.n)}<small>${zi?fmtDist(d):esc(e.b)}</small></button>`).join('')
      :'<span class="mono" style="font-size:11px;color:var(--text-dim)">No encontramos plazas cerca de esa zona.</span>';
  }).catch(()=>{box.remove();});
}
function pickGreen(btn){
  const form=btn.closest('form');const inp=form&&form.querySelector('input[name=place]');
  if(!inp)return;
  inp.value=btn.dataset.v;inp.classList.remove('pulse-ok');void inp.offsetWidth;inp.classList.add('pulse-ok');
  form.querySelectorAll('.gs-chip').forEach(c=>c.classList.toggle('on',c===btn));
  playSound('pop');
}

/* ---------- 2) El clima del día del encuentro (Open-Meteo, gratis y sin clave) ---------- */
let WX=null,_wxP=null;
function loadWeather(){
  if(WX||_wxP)return _wxP||Promise.resolve(WX);
  try{const c=JSON.parse(sessionStorage.getItem('tablon-wx')||'null');if(c&&Date.now()-c.t<3*3600*1000){WX=c.d;return Promise.resolve(WX);}}catch(e){}
  _wxP=fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.61&longitude=-58.44&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FArgentina%2FBuenos_Aires&forecast_days=16')
    .then(r=>r.json()).then(j=>{
      const d={};(j.daily&&j.daily.time||[]).forEach((t,i)=>{d[t]={code:j.daily.weathercode[i],max:j.daily.temperature_2m_max[i],min:j.daily.temperature_2m_min[i],pp:j.daily.precipitation_probability_max[i]};});
      WX=d;try{sessionStorage.setItem('tablon-wx',JSON.stringify({t:Date.now(),d}));}catch(e){}
      _wxP=null;render();return d;
    }).catch(()=>{_wxP=null;WX={};return WX;});
  return _wxP;
}
function wxInfo(code){
  if(code===0)return [ICONS.wxSun,'Despejado'];
  if(code<=2)return [ICONS.wxPartly,'Algo nublado'];
  if(code===3)return [ICONS.wxCloud,'Nublado'];
  if(code===45||code===48)return [ICONS.wxFog,'Neblina'];
  if(code>=51&&code<=57)return [ICONS.wxDrizzle,'Llovizna'];
  if(code>=61&&code<=67)return [ICONS.wxRain,'Lluvia'];
  if(code>=71&&code<=77)return [ICONS.wxSnow,'Frío extremo'];
  if(code>=80&&code<=82)return [ICONS.wxRain,'Chaparrones'];
  if(code>=95)return [ICONS.wxStorm,'Tormenta'];
  return [ICONS.wxThermo,'Pronóstico'];
}
function weatherFor(ymd){if(!WX){loadWeather();return null;}return WX[ymd]||null;}
function weatherChipHTML(m,withTip){
  if(!m.eventDate||isMeetupPast(m))return '';
  const w=weatherFor(m.eventDate);if(!w)return '';
  const [ico,txt]=wxInfo(w.code);const rain=w.pp!=null&&w.pp>=55;const out=isOutdoor(m);
  let tip='';
  if(withTip){
    if(rain||w.code>=61)tip=out?'Puede llover: ¿tienen un plan B bajo techo?':'Puede llover: llevá paraguas.';
    else if(w.max>=30)tip=out?'Mucho calor: buscá sombra, llevá agua y protector.':'Mucho calor: llevá agua.';
    else if(w.max<=11)tip='Hace frío: abrigate bien.';
    else if(out)tip='Ideal para estar al aire libre.';
  }
  return `<span class="wx-chip ${rain?'rain':''}" title="Pronóstico para ese día (Open-Meteo)">${ico}<b>${Math.round(w.max)}°</b><span>${esc(txt)}${w.pp!=null?' · '+w.pp+'% lluvia':''}</span></span>${tip?`<span class="wx-tip">${esc(tip)}</span>`:''}`;
}

/* ---------- 3) Cómo llegar sin auto: Ecobici y subte más cercanos ---------- */
const SUBTE_COL={A:'#18cccc',B:'#eb0909',C:'#233aa8',D:'#02a54f',E:'#c618cc',H:'#ffd600',P:'#ffa200'};
function nearestOf(list,pt,latI,lngI){let best=null,bd=1e9;for(const r of list){const d=distanceKm(pt,{lat:r[latI],lng:r[lngI]});if(d<bd){bd=d;best=r;}}return best?{r:best,d:bd}:null;}
function transitHTML(g,m){
  const V=verdeOrLoad();if(!V)return '';
  const pt=meetupCoords(g,m);if(!pt)return '';
  const eco=nearestOf(V.eco,pt,1,2),sub=nearestOf(V.sub,pt,2,3);
  const parts=[];
  if(eco&&eco.d<1.2)parts.push(`<span class="tr-item" title="Estación de Ecobici más cercana">${ICONS.bike} Ecobici <b>${esc(eco.r[0])}</b> <small>${fmtDist(eco.d)}</small></span>`);
  if(sub&&sub.d<1.6){const ln=sub.r[1].toUpperCase();parts.push(`<span class="tr-item" title="Estación de subte más cercana"><i class="sub-badge" style="--c:${SUBTE_COL[ln]||'#888'}">${esc(ln)}</i> <b>${esc(sub.r[0])}</b> <small>${fmtDist(sub.d)}</small></span>`);}
  const cv=nearestCiclo(pt);
  if(cv&&cv.d<0.8)parts.push(`<span class="tr-item" title="Ciclovía más cercana">${ICONS.road} Ciclovía <b>${esc(cv.n)}</b> <small>${fmtDist(cv.d)}</small></span>`);
  if(!parts.length)return '';
  return `<div class="transit-row"><span class="tr-label">Llegá sin auto${pt.exact?'':' <small>(aprox.)</small>'}</span>${parts.join('')}</div>`;
}

/* ---------- 4) Capas verdes del mapa de Explorar ---------- */
let mapLayersOn={verde:true,cv:false,eco:false,pv:false,mine:false};
/* Ciclovías (datos abiertos GCBA), en un archivo aparte porque solo se cargan si hacen falta */
let CICLO=null,_cicloP=null;
function loadCiclo(){
  if(CICLO)return Promise.resolve(CICLO);
  if(!_cicloP)_cicloP=fetch('data/ciclovias.json').then(r=>{if(!r.ok)throw new Error('ciclo');return r.json();}).then(d=>{
    d.lines=d.cv.map(([n,a])=>{const pts=[[a[0]/1e5,a[1]/1e5]];let y=a[0],x=a[1];for(let i=2;i<a.length;i+=2){y+=a[i];x+=a[i+1];pts.push([y/1e5,x/1e5]);}return {n,pts};});
    CICLO=d;return d;
  }).catch(e=>{_cicloP=null;throw e;});
  return _cicloP;
}
function cicloOrLoad(){if(CICLO)return CICLO;loadCiclo().then(()=>render()).catch(()=>{});return null;}
function nearestCiclo(pt){
  const C=cicloOrLoad();if(!C)return null;let best=null,bd=1e9;
  for(const l of C.lines)for(const q of l.pts){const d=distanceKm(pt,{lat:q[0],lng:q[1]});if(d<bd){bd=d;best=l;}}
  return best?{n:best.n,d:bd}:null;
}
try{const s=JSON.parse(localStorage.getItem('tablon-maplayers')||'null');if(s)mapLayersOn=Object.assign(mapLayersOn,s);}catch(e){}
let _verdeLayer=null,_verdeLayerMap=null;
function toggleMapLayer(k){
  mapLayersOn[k]=!mapLayersOn[k];
  try{localStorage.setItem('tablon-maplayers',JSON.stringify(mapLayersOn));}catch(e){}
  document.querySelectorAll('.layer-chip[data-k="'+k+'"]').forEach(b=>b.classList.toggle('on',mapLayersOn[k]));
  if(k==='mine'){
    const cu=currentUser();
    if(mapLayersOn.mine&&cu&&!state.groups.some(g=>g.members.includes(cu.id)))addToast('Todavía no estás en ningún grupo.');
    updateExploreGrid();return;
  }
  drawVerdeLayers();
}
function mapLayerChipsHTML(){
  const L_=[['mine','groupPin','Solo mis grupos'],['verde','tree','Plazas y parques'],['cv','road','Ciclovías'],['eco','bike','Ecobici'],['pv','recycle','Puntos Verdes']];
  return `<div class="layer-chips">${L_.map(([k,i,t])=>`<button class="layer-chip ${mapLayersOn[k]?'on':''}" data-k="${k}" onclick="toggleMapLayer('${k}')">${ICONS[i]} ${t}</button>`).join('')}<span class="layer-src">Datos abiertos: Gobierno de la Ciudad de Buenos Aires</span></div>`;
}
async function drawVerdeLayers(){
  if(!_map||typeof L==='undefined')return;
  let V;try{V=await loadVerde();}catch(e){return;}
  if(!_map)return;
  if(_verdeLayer&&_verdeLayerMap===_map){_verdeLayer.clearLayers();}
  else{_verdeLayer=L.layerGroup().addTo(_map);_verdeLayerMap=_map;}
  const dark=effectiveTheme()==='dark';
  const rnd=L.canvas({padding:0.3});
  if(mapLayersOn.verde){
    V.ev.forEach(e=>{
      if(e.nd)return; // espacios muy alargados (costaneras, autopistas): no se dibujan
      L.polygon(evRing(e),{renderer:rnd,color:dark?'#5fe39b':'#2e9e5b',weight:1.6,fillColor:dark?'#3ddc8f':'#45b86c',fillOpacity:dark?0.55:0.45})
        .bindPopup('<span class="pp-cat" style="color:#2e9e5b">'+esc(EV_TYPE[e.t]||'Espacio verde')+'</span><span class="pp-name">'+esc(e.n)+'</span>'+esc(e.b)+' · '+(e.a>=10000?(e.a/10000).toFixed(1).replace('.',',')+' ha':Math.round(e.a/100)*100+' m²')+'<br>'+goBtn(e.lat,e.lng,e.n))
        .addTo(_verdeLayer);
    });
  }
  // Ciclovías: si las prendés, o si estás mirando grupos de ciclismo
  if(mapLayersOn.cv||exploreCategoryFilter==='ciclismo'){
    try{
      const C=await loadCiclo();
      if(_verdeLayerMap===_map){
        C.lines.forEach(l=>L.polyline(l.pts,{renderer:rnd,color:dark?'#ffb35c':'#e8892a',weight:2.6,opacity:0.9,lineCap:'round'})
          .bindPopup('<span class="pp-cat" style="color:#e8892a">Ciclovía protegida</span><span class="pp-name">'+esc(l.n)+'</span>Red de ciclovías de la Ciudad').addTo(_verdeLayer));
      }
    }catch(e){}
  }
  if(mapLayersOn.eco){
    V.eco.forEach(s=>L.circleMarker([s[1],s[2]],{renderer:rnd,radius:4,color:'#fff',weight:1.5,fillColor:'#ff8a3d',fillOpacity:1})
      .bindPopup('<span class="pp-cat" style="color:#ff8a3d">Ecobici</span><span class="pp-name">'+esc(s[0])+'</span>Estación de bicis públicas<br>'+goBtn(s[1],s[2],'Ecobici '+s[0])).addTo(_verdeLayer));
  }
  if(mapLayersOn.pv){
    V.pv.forEach(p=>L.marker([p[5],p[6]],{icon:L.divIcon({className:'pv-icon',iconSize:[26,26],iconAnchor:[13,13],html:'<span>'+ICONS.recycle+'</span>'})})
      .bindPopup('<span class="pp-cat" style="color:#2e9e5b">Punto Verde · '+esc(p[1])+'</span><span class="pp-name">'+esc(p[0])+'</span>'+esc(p[3])+(p[4]?', '+esc(p[4]):'')+(p[2]?'<br><small>'+esc(p[2])+'</small>':'')+'<br>'+goBtn(p[5],p[6],p[0])).addTo(_verdeLayer));
  }
}

/* ---------- 5) Impacto verde + desafío del mes ---------- */
function seasonInfo(d){
  const mo=(d||new Date()).getMonth();
  if(mo>=8&&mo<=10)return {id:'primavera',ico:ICONS.flower,label:'Primavera en la ciudad'};
  if(mo===11||mo<=1)return {id:'verano',ico:ICONS.wxSun,label:'Verano en la ciudad'};
  if(mo>=2&&mo<=4)return {id:'otono',ico:ICONS.autumn,label:'Otoño en la ciudad'};
  return {id:'invierno',ico:ICONS.wxSnow,label:'Invierno en la ciudad'};
}
function monthPrefix(){return todayYmd().slice(0,7);}
function cityImpact(){
  const ym=monthPrefix();let meetups=0,people=0;const barrios=new Set();
  state.groups.forEach(g=>g.meetups.forEach(m=>{
    if(!m.eventDate||m.eventDate.slice(0,7)!==ym||!isOutdoor(m))return;
    meetups++;people+=m.going.length;const zi=zoneInfo(g.zone);if(zi)barrios.add(zi.barrio);
  }));
  return {meetups,people,barrios:barrios.size};
}
const CHALLENGES=[
  {id:'plazas',ico:'map',t:'Conocé 3 plazas o parques distintos',goal:3},
  {id:'aire',ico:'tree',t:'Andá a 2 encuentros al aire libre',goal:2},
  {id:'guardian',ico:'sprout',t:'Sumate a una jornada de huerta o voluntariado',goal:1},
  {id:'propone',ico:'groupPin',t:'Proponé un encuentro en una plaza o parque',goal:1},
  {id:'mueve',ico:'bike',t:'Andá a una rodada, salida de running o trekking',goal:1}
];
/* ¿Fue de verdad? Cuenta solo si hizo check-in en el lugar ("📍 Estoy acá") o confirmó con "Fui". */
function attended(m,uid){return (m.checkins||[]).includes(uid)||(m.recaps||[]).some(r=>r.authorId===uid);}
/* Clave del lugar: si es una plaza/parque de la lista oficial del GCBA, usamos ese parque
   (así "Centenario" y "Parque Centenario, Caballito" son el mismo); si no, el texto. */
function greenPlaceKey(g,m){
  const gs=m.place?greenSpaceFor(m.place):null;
  return gs?'gs:'+gs.key:normTxt((m.place||(g.zone+'#'+m.id)).split(',')[0]).trim();
}
function monthChallenge(){const d=new Date();return CHALLENGES[(d.getFullYear()*12+d.getMonth())%CHALLENGES.length];}
function challengeProgress(cu,ch){
  const ym=monthPrefix();let n=0;const places=new Set();
  if(ch.id==='plazas'&&!VERDE)loadVerde().catch(()=>{});
  state.groups.forEach(g=>g.meetups.forEach(m=>{
    if(!m.eventDate||m.eventDate.slice(0,7)!==ym)return;
    const went=attended(m,cu.id);
    if(ch.id==='propone'){if(m.createdBy===cu.id&&isOutdoor(m))n++;return;}
    if(!went)return;
    if(ch.id==='aire'&&isOutdoor(m))n++;
    if(ch.id==='plazas'&&isOutdoor(m))places.add(greenPlaceKey(g,m));
    if(ch.id==='guardian'&&(g.categoryId==='huerta'||g.categoryId==='voluntariado'))n++;
    if(ch.id==='mueve'&&['ciclismo','running','senderismo'].includes(g.categoryId))n++;
  }));
  if(ch.id==='plazas')n=places.size;
  return Math.min(n,ch.goal);
}
function greenCardHTML(cu){
  const s=seasonInfo();const imp=cityImpact();const ch=monthChallenge();const p=challengeProgress(cu,ch);const done=p>=ch.goal;
  const d=new Date();const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();const left=last-d.getDate();
  const parks=VERDE?VERDE.ev.length:350;
  if(done)setTimeout(()=>celebrateChallenge(cu,ch),400);
  return `<div class="green-card season-${s.id}">
    <span class="gc-leaf l1" aria-hidden="true"></span><span class="gc-leaf l2" aria-hidden="true"></span>
    <div class="gc-top"><span class="gc-season">${s.ico} ${esc(s.label)}</span><span class="gc-tag">Tablón Verde</span></div>
    <div class="gc-cols">
      <div class="gc-impact">
        <div class="gc-h">Este ${MESES[d.getMonth()]} en la ciudad</div>
        <div class="gc-stats">
          <div><b>${imp.meetups}</b><span>${imp.meetups===1?'encuentro':'encuentros'} al aire libre</span></div>
          <div><b>${imp.people}</b><span>${imp.people===1?'persona':'personas'} en plazas y parques</span></div>
          <div><b>${imp.barrios}</b><span>${imp.barrios===1?'barrio':'barrios'}</span></div>
        </div>
        <button class="link-btn gc-link" onclick="openGreenMap()">${ICONS.tree} Ver las ${parks} plazas y parques en el mapa →</button>
      </div>
      <div class="gc-chal ${done?'done':''}">
        <div class="gc-h">Desafío del mes</div>
        <div class="gc-ct">${ICONS[ch.ico]||''} ${esc(ch.t)}</div>
        <div class="gc-bar"><i style="width:${Math.round(p/ch.goal*100)}%"></i></div>
        <div class="gc-meta">${done?'¡Desafío cumplido! '+ICONS.leaf:p+' de '+ch.goal+' · quedan '+plural(left,'día')}</div>
        ${done||ch.id==='propone'?'':'<div class="gc-meta" style="margin-top:6px">Cuenta cuando confirmás que fuiste: '+ICONS.pin+' «Estoy acá» en el lugar o «Fui» después.</div>'}
      </div>
    </div>
  </div>`;
}
function openGreenMap(){mapLayersOn.verde=true;try{localStorage.setItem('tablon-maplayers',JSON.stringify(mapLayersOn));}catch(e){}exploreMapOpen=true;setAppView('explorar');}
function celebrateChallenge(cu,ch){
  const k='tablon-chal-'+cu.id+'-'+monthPrefix()+'-'+ch.id;
  try{if(localStorage.getItem(k))return;localStorage.setItem(k,'1');}catch(e){return;}
  playSound('going');confettiRain(70);addToast('¡Cumpliste el desafío del mes!');
}

/* ================= SONIDOS =================
   Los sonidos se arman en el momento con Web Audio, así que no hay archivos
   de audio para descargar. Son cortitos y bajitos a propósito. Se apagan
   desde el menú del perfil o en Mi perfil > Apariencia (queda guardado en
   el navegador, igual que el tema). */
let _audio=null;
function soundEnabled(){
  try{return localStorage.getItem('tablon-sound')!=='off';}catch(e){return true;}
}
function audioOut(){
  if(!_audio){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    const ctx=new AC(),master=ctx.createGain();
    master.gain.value=0.55;master.connect(ctx.destination);
    _audio={ctx,master};
  }
  if(_audio.ctx.state==='suspended')_audio.ctx.resume();
  return _audio;
}
// Un "blip": una nota corta que entra y se apaga suave (f = frecuencia, to = hacia dónde se desliza).
function blip(a,o){
  const t=a.ctx.currentTime+(o.at||0),dur=o.dur||0.12;
  const osc=a.ctx.createOscillator(),g=a.ctx.createGain();
  osc.type=o.type||'sine';
  osc.frequency.setValueAtTime(o.f,t);
  if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(o.vol||0.1,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g);g.connect(a.master);
  osc.start(t);osc.stop(t+dur+0.03);
}
// Un ruidito filtrado, tipo hoja de papel que se da vuelta (para cambiar de mes).
function rustle(a,o){
  const t=a.ctx.currentTime+(o.at||0),dur=o.dur||0.08;
  const len=Math.floor(a.ctx.sampleRate*dur);
  const buf=a.ctx.createBuffer(1,len,a.ctx.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
  const src=a.ctx.createBufferSource(),bp=a.ctx.createBiquadFilter(),g=a.ctx.createGain();
  src.buffer=buf;bp.type='bandpass';bp.frequency.value=o.f||2200;bp.Q.value=0.9;
  g.gain.value=o.vol||0.1;
  src.connect(bp);bp.connect(g);g.connect(a.master);
  src.start(t);
}
const SOUNDS={
  tap:     a=>blip(a,{f:880,to:620,type:'triangle',dur:0.05,vol:0.06}),
  select:  a=>{blip(a,{f:660,dur:0.12,vol:0.08});blip(a,{f:990,at:0.03,dur:0.1,vol:0.04});},
  flip:    a=>{rustle(a,{f:2600,dur:0.07,vol:0.12});rustle(a,{f:1500,at:0.05,dur:0.09,vol:0.08});},
  going:   a=>[523.25,659.25,783.99].forEach((f,i)=>blip(a,{f,at:i*0.075,dur:0.26,vol:0.09})),
  notGoing:a=>{blip(a,{f:587.33,dur:0.14,vol:0.08});blip(a,{f:440,at:0.08,dur:0.2,vol:0.07});},
  pop:     a=>blip(a,{f:420,to:900,dur:0.09,vol:0.09}),
  open:    a=>blip(a,{f:520,to:780,type:'triangle',dur:0.1,vol:0.06}),
  toggle:  a=>{blip(a,{f:740,type:'triangle',dur:0.06,vol:0.07});blip(a,{f:1110,type:'triangle',at:0.06,dur:0.08,vol:0.05});}
};
function playSound(name){
  if(!soundEnabled()||!SOUNDS[name])return;
  try{const a=audioOut();if(a)SOUNDS[name](a);}catch(e){}
}
function toggleSound(el){
  const on=!soundEnabled();
  try{localStorage.setItem('tablon-sound',on?'on':'off');}catch(e){}
  if(on)playSound('toggle');
  // El switch de Apariencia se anima en el lugar, sin redibujar toda la página.
  if(el&&el.classList.contains('switch')){
    el.classList.toggle('on',on);
    el.setAttribute('aria-checked',on?'true':'false');
    const lbl=document.getElementById('soundHint');
    if(lbl)lbl.textContent=on?'Activados':'Apagados';
    return;
  }
  render();
}

/* ================= EFECTOS =================
   Chispitas de colores que salen de un botón (por ejemplo al tocar "Voy").
   Se dibujan afuera de #app, así sobreviven al re-render de la pantalla. */
function reduceMotion(){return !!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);}
function burstAt(el){
  if(!el||!el.getBoundingClientRect||reduceMotion())return;
  const r=el.getBoundingClientRect();
  const wrap=document.createElement('div');
  wrap.className='burst';
  wrap.style.left=(r.left+r.width/2)+'px';
  wrap.style.top=(r.top+r.height/2)+'px';
  const colors=['#ff3d6e','#5169ff','#f6df3f','#38c98d','#ff8a3d'];
  for(let i=0;i<12;i++){
    const ang=(Math.PI*2*i/12)+(Math.random()*0.4-0.2);
    const dist=26+Math.random()*18;
    const p=document.createElement('i');
    p.style.background=colors[i%colors.length];
    p.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(1)+'px');
    p.style.setProperty('--dy',(Math.sin(ang)*dist).toFixed(1)+'px');
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(),700);
}

/* ================= AUTH =================
   Las contraseñas viajan por HTTPS al servidor y se verifican/guardan ahí
   con password_hash()/password_verify() de PHP (bcrypt) — nunca se procesan
   ni se comparan en el navegador. La sesión la mantiene PHP con una cookie. */
function openAuth(tab){state.authOpen=true;state.authTab=tab||'login';render();}
function closeAuth(){state.authOpen=false;render();}
function switchAuthTab(tab){state.authTab=tab;render();}
function toggleRegisterCat(catId){
  const i=state.registerCats.indexOf(catId);
  if(i>-1)state.registerCats.splice(i,1);else state.registerCats.push(catId);
  render();
}
async function loginSubmit(e){
  e.preventDefault();
  const submitBtn=e.target.querySelector('button[type=submit]');
  const handle=e.target.handle.value.trim();
  const password=e.target.password.value;
  if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Verificando...';}
  try{
    const res=await apiCall('login',{handle,password});
    if(!res.ok){addToast(res.error||'No pudimos iniciar sesión.');return;}
    await loadBootstrap();
    state.authOpen=false;
    const cu=currentUser();
    if(cu&&cu.categories.length===0){
      state.view='onboarding';
    }else{
      state.view='app';state.appView='inicio';
      goToPendingRoute();
      addToast('Volviste, '+(res.name||'').split(' ')[0]+'.');
    }
    render();
  }catch(err){addToast('No pudimos conectar con el servidor.');}
  finally{if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='Entrar';}}
}
async function loginGuest(){
  try{
    const res=await apiCall('guest_login');
    if(!res.ok){addToast(res.error||'No pudimos entrar como invitade.');return;}
    await loadBootstrap();
    state.view='app';state.appView='inicio';state.authOpen=false;
    goToPendingRoute();
    render();window.scrollTo(0,0);addToast('Entraste con la cuenta demo de Bianca.');

}
async function registerSubmit(e){
  e.preventDefault();
  const submitBtn=e.target.querySelector('button[type=submit]');
  const name=e.target.name.value.trim();
  const handle=e.target.handle.value.trim().replace('@','');
  const email=e.target.email.value.trim();
  const password=e.target.password.value;
  if(!name||!handle){addToast('Falta el nombre o el usuario.');return;}
  if(!email||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){addToast('Ingresá un Gmail válido.');return;}
  if(!/^[a-z0-9_.]{3,30}$/i.test(handle)){addToast('El usuario va de 3 a 30 caracteres: letras, números, punto o guion bajo.');return;}
  if(password.length<8){addToast('La contraseña tiene que tener al menos 8 caracteres.');return;}
  if(!e.target.acceptRules.checked){addToast('Para crear la cuenta tenés que aceptar las normas de la comunidad.');return;}
  if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Creando cuenta...';}
  try{
    const res=await apiCall('register',{name,handle:handle.toLowerCase(),email,password,acceptRules:true});
    if(!res.ok){addToast(res.error||'No pudimos crear la cuenta.');return;}
    state.pendingVerifyEmail=email;
    state.devVerifyLink=res.devVerifyLink||null;
    state.authOpen=false;
    state.view='checkEmail';
    render();
  }catch(err){addToast('No pudimos conectar con el servidor.');}
  finally{if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='Crear cuenta';}}
}
async function resendVerification(){
  if(!state.pendingVerifyEmail)return;
  try{
    const res=await apiCall('resend_verification',{email:state.pendingVerifyEmail});
    if(!res.ok){addToast(res.error||'No pudimos reenviar el mail.');return;}
    state.devVerifyLink=res.devVerifyLink||null;
    render();
    addToast('Te reenviamos el mail de confirmación.');
  }catch(err){addToast('No pudimos conectar con el servidor.');}
}
function resendVerificationPrompt(){

}

async function submitPasswordReset(e){
  e.preventDefault();
  const submitBtn=e.target.querySelector('button[type=submit]');
  const password=e.target.password.value;
  const password2=e.target.password2.value;
  if(password.length<8){addToast('La contraseña tiene que tener al menos 8 caracteres.');return;}
  if(password!==password2){addToast('Las contraseñas no coinciden.');return;}
  if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Guardando...';}
  try{
    const res=await apiCall('reset_password',{token:state.resetToken,password});
    if(!res.ok){addToast(res.error||'No pudimos actualizar la contraseña.');return;}
    state.resetToken=null;
    history.replaceState({},'',location.pathname);
    state.view='landing';state.authOpen=true;state.authTab='login';
    render();
    addToast('Contraseña actualizada. Iniciá sesión con la nueva.');
  }catch(err){addToast('No pudimos conectar con el servidor.');}
  finally{if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='Guardar contraseña';}}
}
async function finishOnboarding(skip){

    goToPendingRoute();

/* ================= TEMA CLARO / OSCURO =================
   Se guarda en el navegador: 'light', 'dark' o 'system' (sigue al celu/compu).
   El script chiquito del <head> ya lo aplica antes de pintar la página. */
function getThemePref(){
  try{return localStorage.getItem('tablon-theme')||'system';}catch(e){return 'system';}
}
function effectiveTheme(pref){
  const p=pref||getThemePref();
  if(p!=='system')return p;
  return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}
function applyTheme(){document.documentElement.setAttribute('data-theme',effectiveTheme());}
function setThemePref(p){
  try{localStorage.setItem('tablon-theme',p);}catch(e){}
  applyTheme();render();
}
function toggleTheme(){playSound('toggle');setThemePref(effectiveTheme()==='dark'?'light':'dark');}
if(window.matchMedia){
  const mq=matchMedia('(prefers-color-scheme: dark)');
  const onSystemChange=()=>{if(getThemePref()==='system'){applyTheme();if(state.view==='app')render();}};
  if(mq.addEventListener)mq.addEventListener('change',onSystemChange);else if(mq.addListener)mq.addListener(onSystemChange);
}

/* ================= CALENDARIO =================
   Todo sale de los encuentros que ya trae el bootstrap (fecha, hora, lugar y
   quién va), así que no hace falta pedirle nada nuevo a la API. Las fechas
   se manejan como texto 'AAAA-MM-DD' para no pelearse con husos horarios. */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS_LARGOS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS_CAL=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
function pad2(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function parseYmd(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function todayYmd(){return ymd(new Date());}
function nowHM(){const d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes());}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);}
function daysFromToday(s){return Math.round((parseYmd(s)-parseYmd(todayYmd()))/86400000);}
function relDayLabel(n){
  if(n===0)return 'Hoy';
  if(n===1)return 'Mañana';
  if(n===-1)return 'Ayer';
  if(n>1)return n<14?'En '+n+' días':'En '+Math.round(n/7)+' semanas';
  return 'Hace '+(-n)+' días';
}
function capFirst(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function isMeetupPast(m){
  if(!m.eventDate)return false;
  const t=todayYmd();
  return m.eventDate<t||(m.eventDate===t&&(m.eventTime||'23:59')<nowHM());
}
// Encuentros para el calendario: los de tus grupos (o a los que te anotaste),
// ordenados por fecha y hora. Con filter='going' quedan solo a los que vas.
function calendarEvents(cu,filter){
  const out=[];
  state.groups.forEach(g=>{
    const isMember=g.members.includes(cu.id);
    g.meetups.forEach(m=>{
      const going=m.going.includes(cu.id);
      if(!going&&(filter==='going'||!isMember))return;
      out.push({g,m,going});
    });
  });
  const key=e=>(e.m.eventDate||'9999-99-99')+' '+(e.m.eventTime||'99:99');
  return out.sort((a,b)=>key(a)<key(b)?-1:key(a)>key(b)?1:0);
}
function calSelectedDay(){return state.calSelected||todayYmd();}
function calMonthShown(){return state.calMonth||calSelectedDay().slice(0,7);}
function calShiftMonthStr(month,delta){
  const p=month.split('-').map(Number);
  const d=new Date(p[0],p[1]-1+delta,1);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1);
}
// Dibuja con una animación puntual y después la apaga, así los re-render
// normales (por ejemplo al tocar "Voy") no repiten la animación.
function renderWithCalAnim(anim,agenda){
  state.calAnim=anim||null;state.calAgendaAnim=!!agenda;
  render();
  state.calAnim=null;state.calAgendaAnim=false;
}
function openCalendar(day){
  playSound('open');
  if(day){state.calSelected=day;state.calMonth=day.slice(0,7);}
  else state.calMonth=null; // volvés a ver el mes del día que tenías elegido
  state.appView='calendario';state.activeGroupId=null;state.meetupFormOpen=false;
  state.profileMenuOpen=false;state.notifPanelOpen=false;
  renderWithCalAnim('in',true);
  window.scrollTo(0,0);
}
function calShiftMonth(delta){
  playSound('flip');
  state.calMonth=calShiftMonthStr(calMonthShown(),delta);
  renderWithCalAnim(delta>0?'next':'prev',false);
}
function calGoToday(){
  const t=todayYmd();
  const sameMonth=calMonthShown()===t.slice(0,7);
  playSound(sameMonth?'select':'flip');
  const dir=t.slice(0,7)>calMonthShown()?'next':'prev';
  state.calSelected=t;state.calMonth=t.slice(0,7);
  renderWithCalAnim(sameMonth?null:dir,true);
}
function calSelectDay(day){
  if(day===calSelectedDay()&&day.slice(0,7)===calMonthShown())return;
  const month=day.slice(0,7),shown=calMonthShown();
  state.calSelected=day;state.calMonth=month;
  if(month!==shown){playSound('flip');renderWithCalAnim(month>shown?'next':'prev',true);}
  else{playSound('select');renderWithCalAnim(null,true);}
}
function calMoveSelection(step){calSelectDay(addDays(calSelectedDay(),step));}
function calSetFilter(f){
  if(state.calFilter===f)return;
  playSound('tap');
  state.calFilter=f;
  renderWithCalAnim(null,true);
}

/* Descarga el encuentro como archivo .ics: se abre con Google Calendar, el
   calendario del celu o Outlook y queda agendado con recordatorio. */
function downloadMeetupIcs(gid,mid){
  const g=getGroup(gid),m=g&&g.meetups.find(x=>x.id===mid);
  if(!m||!m.eventDate)return;
  playSound('tap');
  const start=parseYmd(m.eventDate);
  const hm=(m.eventTime||'00:00').split(':').map(Number);
  start.setHours(hm[0],hm[1],0,0);
  const end=new Date(start.getTime()+2*3600000);
  const stamp=d=>d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'T'+pad2(d.getHours())+pad2(d.getMinutes())+'00';
  const utc=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/([,;])/g,'\\$1');
  const ics=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tablon//Calendario//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:meetup-'+m.id+'@tablon.gt.tc',
    'DTSTAMP:'+utc,
    'DTSTART:'+stamp(start),
    'DTEND:'+stamp(end),
    'SUMMARY:'+icsEsc(m.title),
    'LOCATION:'+icsEsc(m.placeHidden?placeShort(m):m.place),
    'DESCRIPTION:'+icsEsc('Encuentro de '+g.name+' en Tablón. '+linkFor('#/encuentro/'+m.id)),
    'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(m.title),'END:VALARM',
    'END:VEVENT','END:VCALENDAR'
  ].join('\r\n');
  const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a');
  a.href=url;a.download=(slugify(m.title)||'encuentro')+'.ics';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  addToast('Listo: abrí el archivo para sumarlo a tu calendario.');
}

/* ================= ACTIONS =================
   Cada acción le pega a la API y, si sale bien, vuelve a traer el estado
   fresco desde la base de datos antes de re-renderizar. Así la UI nunca
   queda desincronizada de lo que realmente quedó guardado en MySQL. */

/* "Voy / No voy": igual que las reacciones, se marca al toque en pantalla
   (con sonido y chispitas) y después se confirma con el servidor. */
async function toggleGoing(gid,mid,btn){
  const g=getGroup(gid),m=g&&g.meetups.find(x=>x.id===mid),uid=state.currentUserId;
  let action=null; // 'going' | 'waitlist' | 'leave'
  if(m){
    m.waitlist=m.waitlist||[];
    if(m.going.includes(uid)){action='leave';m.going=m.going.filter(id=>id!==uid);}
    else if(m.waitlist.includes(uid)){action='leave';m.waitlist=m.waitlist.filter(id=>id!==uid);}
    else if(isFull(m)){action='waitlist';m.waitlist=m.waitlist.concat(uid);}
    else{action='going';m.going=m.going.concat(uid);}
  }
  if(action==='going'){playSound('going');burstAt(btn);}else if(action==='waitlist')playSound('pop');else playSound('notGoing');
  render();
  let gotIn=false;
  try{
    const res=await apiCall('toggle_going',{groupId:gid,meetupId:mid});
    if(!res.ok)addToast(res.error||'No pudimos actualizar tu asistencia.');
    else if(res.status==='waitlist')addToast('Está completo: quedaste en la lista de espera. Si se libera un lugar, te avisamos.');
    else if(res.status==='going'){gotIn=true;if(state.appView!=='calendario')addToast('Anotade. Ya lo tenés en tu calendario.');}
  }catch(err){addToast('No pudimos conectar con el servidor.');}
  await refreshAndRender();
  if(gotIn)openTicket(gid,mid);  // el ticket coleccionable aparece al anotarte
}

/* Reacciones: actualizamos la pantalla al toque (así se siente rápido) y
   después confirmamos con el servidor. Si algo falla, volvemos a traer
   todo de la base para que no quede nada mentiroso en pantalla. */
function findPost(pid){
  for(const g of state.groups){const p=(g.posts||[]).find(p=>p.id===pid);if(p)return p;}
  return null;
}
function toggleReactPicker(pid){
  state.reactPickerPostId=state.reactPickerPostId===pid?null:pid;
  if(state.reactPickerPostId)playSound('tap');
  render();

async function reactToPost(pid,type){
  const p=findPost(pid);
  const uid=state.currentUserId;
  state.reactPickerPostId=null;
  if(p){
    const prev=myReactionOn(p,uid);
    playSound(prev===type?'tap':'pop');
    const r=Object.assign({},p.reactions||{});
    if(prev)r[prev]=r[prev].filter(id=>id!==uid);
    if(prev!==type)r[type]=(r[type]||[]).concat(uid);
    for(const k in r)if(!r[k].length)delete r[k];
    p.reactions=r;
  }
  render();
  try{
    const res=await apiCall('react_post',{postId:pid,reaction:type});
    if(!res.ok){addToast(res.error||'No pudimos guardar tu reacción.');await refreshAndRender();}
  }catch(err){addToast('No pudimos conectar con el servidor.');await refreshAndRender();}
}
/* Botón principal: si no reaccionaste, pone "Me gusta"; si ya reaccionaste, la saca. */
function quickReact(pid){
  const p=findPost(pid);
  const mine=p?myReactionOn(p,state.currentUserId):null;
  reactToPost(pid,mine||'like');
}
function reactionNames(p){
  const r=p.reactions||{};
  const out=[];
  REACTIONS.forEach(def=>(r[def.id]||[]).forEach(uid=>{
    const u=getUser(uid);
    out.push((uid===state.currentUserId?'Vos':(u?u.name:'Alguien'))+' ('+def.label.toLowerCase()+')');
  }));
  return out;
}

/* ================= FOTOS (subida por multipart, no JSON) ================= */
async function uploadFile(action,extraFields,file){
  const fd=new FormData();
  fd.append('action',action);
  for(const k in extraFields)fd.append(k,extraFields[k]);
  fd.append('photo',file);
  const res=await fetch('api/index.php',{method:'POST',credentials:'same-origin',body:fd});
  let data;
  try{data=await res.json();}catch(e){throw new Error('El servidor no devolvió una respuesta válida.');}
  return data;
}

  try{

    if(!res.ok){addToast(res.error||'No pudimos subir la foto.');return;}
    await refreshAndRender();

async function saveProfile(e){
  e.preventDefault();
  const f=e.target;
  const submitBtn=f.querySelector('button[type=submit]');
  const name=f.name.value.trim();
  const handle=f.handle.value.trim().replace(/^@/,'').toLowerCase();
  const zone=f.zone.value.trim();
  const bio=f.bio.value.trim();
  if(!name){addToast('El nombre no puede quedar vacío.');return;}
  if(!/^[a-z0-9_.]{3,30}$/.test(handle)&&('@'+handle)!==currentUser().handle.toLowerCase()){
    addToast('El usuario va de 3 a 30 caracteres: letras, números, punto o guion bajo.');return;
  }
  if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Guardando...';}
  try{
    const res=await apiCall('update_profile',{name,handle,zone,bio});
    if(!res.ok){addToast(res.error||'No pudimos guardar tu perfil.');return;}
    await refreshAndRender();
    addToast('Perfil actualizado.');
  }catch(err){addToast('No pudimos conectar con el servidor.');}
  finally{if(submitBtn&&submitBtn.isConnected){submitBtn.disabled=false;submitBtn.textContent='Guardar cambios';}}
}

function filterGroups(term,catId,opts){
  const o=opts||{};
  term=normTxt(term||'');
  let list=state.groups.filter(g=>{
    if(catId!=='all'&&g.categoryId!==catId)return false;
    if(term&&!normTxt(g.name+' '+g.description+' '+g.zone+' '+catLabel(g.categoryId)).includes(term))return false;
    if(o.ignoreExtra)return true;
    if(exploreZone!=='all'){
      const zi=zoneInfo(g.zone);
      if(exploreZone==='otros'?!!zi:(!zi||zi.barrio!==exploreZone))return false;
    }
    if(exploreNear&&myPos){const d=groupDistance(g);if(d===null||d>exploreRadius)return false;}
    if(exploreBeginner&&!upcomingOf(g).some(m=>m.level==='principiante'))return false;
    if(exploreHideIdle&&!term&&isIdle(g))return false;
    return true;
  });
  // Primero los que tienen algo pronto, después los más activos.
  list.sort((a,b)=>{
    if(exploreNear&&myPos){const da=groupDistance(a),db=groupDistance(b);if(da!==db)return (da??99)-(db??99);}
    if(isIdle(a)!==isIdle(b))return isIdle(a)?1:-1;
    const na=nextMeetup(a),nb=nextMeetup(b);
    if(!!na!==!!nb)return na?-1:1;
    if(na&&nb&&meetupKey(na)!==meetupKey(nb))return meetupKey(na)<meetupKey(nb)?-1:1;
    return (a.idleSeconds||0)-(b.idleSeconds||0);
  });
  return list;
}

/* Leaflet (el mapa) se carga recién cuando alguien abre el mapa. */
let _leafletLoading=null,_map=null,_mapLayer=null;
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  if(_leafletLoading)return _leafletLoading;
  _leafletLoading=new Promise((ok,ko)=>{
    const sc=document.createElement('script');
    sc.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';sc.crossOrigin='';
    sc.onload=ok;sc.onerror=()=>{_leafletLoading=null;ko();};
    document.head.appendChild(sc);
  });
  return _leafletLoading;
}
async function drawExploreMap(list){
  const el=document.getElementById('exploreMap');if(!el)return;
  try{await loadLeaflet();}catch(e){el.innerHTML='<p style="padding:20px">No pudimos cargar el mapa. Revisá tu conexión.</p>';return;}
  if(!document.body.contains(el))return;
  const theme=effectiveTheme();
  if(!_map||_map.getContainer()!==el||_map._tablonTheme!==theme){
    if(_map){try{_map.remove();}catch(e){}}
    _map=L.map(el,{scrollWheelZoom:false,zoomControl:false}).setView([-34.605,-58.43],12);
    _map._tablonTheme=theme;
    // Mapa con la estética de Tablón: los colores (oscuro / cálido) se los da un filtro CSS sobre las tiles de OpenStreetMap.
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(_map);
    L.control.zoom({position:'bottomright',zoomInTitle:'Acercar',zoomOutTitle:'Alejar'}).addTo(_map);
    // La rueda del mouse hace zoom recién cuando tocás el mapa (así no te "atrapa" al bajar por la página).
    const closeOverlays=()=>{if(_layersOpen)toggleMapLayersPanel();if(_mapHelp)closeMapHelp();};
    _map.on('click',()=>{_map.scrollWheelZoom.enable();closeOverlays();});
    _map.on('popupopen dragstart',closeOverlays);
    _map.on('dragstart',()=>{if(_nav&&_nav.follow){_nav.follow=false;navUpdate();}});
    _map.on('mouseout',()=>_map.scrollWheelZoom.disable());
    addLocateControl(_map);
    _mapLayer=L.layerGroup().addTo(_map);
    _verdeLayer=null;_meMarker=null;_routeLayer=null;_searchLayer=null;
    if(_meWatch!==null&&myPos)drawMe();
    if(_route&&_route.geo)drawRoute(false);
  }
  _mapLayer.clearLayers();
  const colors={pink:'#ff3d6e',blue:'#5169ff',yellow:'#f6df3f',green:'#38c98d',orange:'#ff8a3d'};
  const pts=[];
  // Capa "Solo mis grupos": se ocultan las chinches de los grupos donde no estás.
  if(mapLayersOn.mine){const cu=currentUser();list=cu?list.filter(g=>g.members.includes(cu.id)):[];}
  // Un solo pin por barrio: si hay varios grupos, el pin muestra cuántos y al tocarlo aparece la lista.
  const byZone={};
  list.forEach(g=>{
    const zi=zoneInfo(g.zone);if(!zi)return;
    const k=zi.lat+','+zi.lng;(byZone[k]=byZone[k]||{zi,gs:[]}).gs.push(g);
  });
  const ppColor=cc=>cc==='#f6df3f'?'#a08a00':cc;
  _zoneMarkers={};
  Object.values(byZone).forEach(({zi,gs})=>{
    const cols=[...new Set(gs.map(g=>colors[catColorName(g.categoryId)]))];
    const cc=cols.length===1?cols[0]:'#14161f';
    let html;
    if(gs.length===1){
      const g=gs[0],nx=nextMeetup(g),c=colors[catColorName(g.categoryId)];
      html='<span class="pp-cat" style="color:'+ppColor(c)+'">'+esc(catLabel(g.categoryId))+'</span><span class="pp-name">'+esc(g.name)+'</span>'+esc(g.zone)+' · '+plural(g.members.length,'miembro')
        +(nx?'<br>Próximo: <b>'+esc(meetupWhen(nx))+'</b>':'')+'<br><a href="#/grupo/'+g.id+'">Ver grupo →</a>';
      const d=groupDest(g);if(d)html+='<br>'+goBtn(d.lat,d.lng,d.label);
    }else{
      html='<span class="pp-cat" style="color:#5a5c6b">'+esc(zi.barrio)+'</span><span class="pp-name">'+gs.length+' grupos</span><div class="pp-list">'
        +gs.map(g=>{const nx=nextMeetup(g);return '<div class="pp-row"><i style="background:'+colors[catColorName(g.categoryId)]+'"></i><div><a href="#/grupo/'+g.id+'">'+esc(g.name)+'</a><small>'+esc(catLabel(g.categoryId))+(nx?' · '+esc(meetupWhen(nx)):'')+'</small></div></div>';}).join('')+'</div>'
        +goBtn(zi.lat,zi.lng,zi.barrio);
    }
    const mk=L.marker([zi.lat,zi.lng],{icon:tackIcon(cc,gs.length),title:gs.length===1?gs[0].name:zi.barrio+' · '+gs.length+' grupos',riseOnHover:true})
      .bindPopup(html,{maxWidth:260}).addTo(_mapLayer);
    _zoneMarkers[zi.lat+','+zi.lng]=mk;
    pts.push([zi.lat,zi.lng]);
  });
  drawMyMeetups();
  if(myPos&&exploreNear){
    L.circle([myPos.lat,myPos.lng],{radius:exploreRadius*1000,color:'#1a73e8',weight:1,fillOpacity:0.05,interactive:false}).addTo(_mapLayer);
    pts.push([myPos.lat,myPos.lng]);
    drawMe();
  }
  setTimeout(()=>{try{_map.invalidateSize();if(_route&&_route.geo)return;if(pts.length>1)_map.fitBounds(pts,{padding:[30,30],maxZoom:14});else if(pts.length)_map.setView(pts[0],14);}catch(e){}},50);
  drawVerdeLayers();
  renderRouteSheet();
  if(_pendingRoute){const p=_pendingRoute;_pendingRoute=null;setTimeout(()=>routeTo(p.lat,p.lng,p.label,null,p.meetup),120);}
  if(_nav)navAfterRedraw();
}

/* Adónde te lleva "Cómo llegar" desde un grupo: al lugar del próximo encuentro si lo podés ver
   y es una plaza/parque conocido; si no, al centro del barrio del grupo. */
function groupDest(g){
  const nx=nextMeetup(g);
  if(nx&&nx.place){const c=meetupCoords(g,nx);if(c&&c.exact)return {lat:c.lat,lng:c.lng,label:nx.place.split(',')[0]};}
  const zi=zoneInfo(g.zone);return zi?{lat:zi.lat,lng:zi.lng,label:g.zone}:null;
}
function mapSearch(q){
  const el=document.getElementById('mapxRes');if(!el)return;q=normTxt(q).trim();
  if(q.length<2){el.innerHTML='';_msRes=[];return;}
  const out=[];
  myMeetups().forEach(({g,m})=>{if(normTxt(m.title+' '+m.place+' '+g.name).includes(q))out.push({k:'m',ico:'star',t:m.title,s:meetupWhen(m)+' · '+m.place.split(',')[0],gid:g.id,mid:m.id});});
  state.groups.forEach(g=>{if(normTxt(g.name).includes(q)&&zoneInfo(g.zone))out.push({k:'g',ico:'groupPin',t:g.name,s:catLabel(g.categoryId)+' · '+g.zone,id:g.id});});
  const seenB={};PLACES.forEach(p=>{const b=p[3];if(!seenB[b]&&normTxt(b).includes(q)){seenB[b]=1;out.push({k:'p',ico:'city',t:b,s:'Barrio',lat:p[1],lng:p[2],z:15});}});
  if(VERDE){VERDE.ev.forEach(e=>{if(e.key.includes(q))out.push({k:'p',ico:'tree',t:e.n,s:(EV_TYPE[e.t]||'Espacio verde')+' · '+e.b,lat:e.lat,lng:e.lng,z:16});});}
  else loadVerde().then(()=>{const i=document.getElementById('mapxQ');if(i&&i.value)mapSearch(i.value);}).catch(()=>{});

function destIcon(){return L.divIcon({className:'dest-icon',iconSize:[30,42],iconAnchor:[15,40],popupAnchor:[0,-36],

/* ---------- Tus encuentros en el mapa, en el lugar exacto (⭐) ----------
   Solo los encuentros a los que vas y cuyo lugar podés ver (sos miembro del grupo).
   Si el lugar es una plaza/parque de la lista del GCBA usamos ese parque; si es una dirección
   ("Av. Corrientes 1500"), la buscamos una vez en OpenStreetMap y la guardamos en tu navegador. */
let _mineMarkers={},_geoCache={},_geoInflight={},_mineGen=0;
try{_geoCache=JSON.parse(localStorage.getItem('tablon-geo')||'{}')||{};}catch(e){}
function myMeetups(){
  const cu=currentUser();if(!cu)return [];const out=[];
  state.groups.forEach(g=>g.meetups.forEach(m=>{
    if(m.place&&!m.placeHidden&&m.going.includes(cu.id)&&(!isMeetupPast(m)||checkinOpen(m)))out.push({g,m});
  }));
  return out.sort((a,b)=>((a.m.eventDate||'')+(a.m.eventTime||'')).localeCompare((b.m.eventDate||'')+(b.m.eventTime||'')));
}
async function geocodePlace(text){
  const k=normTxt(text).trim();if(!k)return null;
  if(k in _geoCache)return _geoCache[k];

  return _geoInflight[k]=(async()=>{try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=ar&viewbox=-58.54,-34.52,-58.33,-34.71&bounded=1&q='+encodeURIComponent(text));
    const j=await r.json();
    const v=j&&j[0]?{lat:+j[0].lat,lng:+j[0].lon}:null;
    _geoCache[k]=v;try{localStorage.setItem('tablon-geo',JSON.stringify(_geoCache));}catch(e){}
    return v;
  }catch(e){return undefined;}finally{delete _geoInflight[k];}})();
}
async function exactCoords(g,m){
  try{await loadVerde();}catch(e){}

  if(c&&c.exact)return c;

function meetupPinIcon(){return L.divIcon({className:'mine-icon',iconSize:[40,52],iconAnchor:[20,50],popupAnchor:[0,-46],

function myMeetupPopup(g,m,c){

async function drawMyMeetups(){
  const map=_map,layer=_mapLayer;if(!map||!layer)return;
