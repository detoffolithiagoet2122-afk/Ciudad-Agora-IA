/* ---------- Rutas: de donde estás a donde quieras ----------
   Las calcula el servidor público de OpenStreetMap (routing.openstreetmap.de), gratis y sin clave.
   Para colectivo/subte te mandamos a Google Maps, que tiene los horarios del transporte. */
let _route=null,_routeLayer=null,_pendingRoute=null;
const ROUTE_MODES={foot:{ico:'walk',t:'A pie',srv:'routed-foot',g:'walking',kmh:4.5},bike:{ico:'bike',t:'Bici',srv:'routed-bike',g:'bicycling',kmh:14},car:{ico:'car',t:'Auto',srv:'routed-car',g:'driving',kmh:25}};
function getMyPos(){
  return new Promise((ok,ko)=>{
    if(myPos&&_meWatch!==null)return ok(myPos);
    if(!navigator.geolocation)return ko(new Error('nogeo'));
    navigator.geolocation.getCurrentPosition(p=>{myPos={lat:p.coords.latitude,lng:p.coords.longitude};_meAccuracy=p.coords.accuracy;drawMe();ok(myPos);},
      e=>ko(e),{enableHighAccuracy:true,maximumAge:60000,timeout:15000});
  });
}
async function routeTo(lat,lng,label,mode,meetup){
  if(_mapHelp)closeMapHelp();
  if(_nav)stopNav(true);
  _route={dest:{lat,lng},label:label||'Destino',mode:mode||null,state:'loading',meetup:meetup||null};renderRouteSheet();
  try{await getMyPos();}catch(e){if(_route){_route.state='nopos';renderRouteSheet();}return;}
  if(!_route)return;
  if(!_route.mode){const d=distanceKm(myPos,_route.dest);_route.mode=d<2.5?'foot':d<12?'bike':'car';}
  calcRoute();
}
async function calcRoute(fit){
  if(fit===undefined)fit=true;
  const r=_route;if(!r||!myPos)return;
  if(!_nav){r.state='loading';renderRouteSheet();}
  const M=ROUTE_MODES[r.mode];r.from={lat:myPos.lat,lng:myPos.lng};
  try{
    const res=await fetch('https://routing.openstreetmap.de/'+M.srv+'/route/v1/driving/'+r.from.lng+','+r.from.lat+';'+r.dest.lng+','+r.dest.lat+'?overview=full&geometries=geojson&steps=true');
    const j=await res.json();
    if(j.code!=='Ok'||!j.routes||!j.routes.length)throw new Error('sin ruta');
    if(_route!==r)return;
    r.geo=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);r.dist=j.routes[0].distance;r.dur=j.routes[0].duration;r.state='ok';
    r.steps=(j.routes[0].legs&&j.routes[0].legs[0]&&j.routes[0].legs[0].steps)||[];
  }catch(e){
    if(_route!==r)return;
    r.geo=[[r.from.lat,r.from.lng],[r.dest.lat,r.dest.lng]];r.dist=distanceKm(r.from,r.dest)*1000;r.dur=r.dist/1000/M.kmh*3600;r.state='straight';r.steps=[];
  }
  drawRoute(fit&&!_nav);renderRouteSheet();
  if(_nav){_nav.idx=0;_nav.warned=-1;_nav.off=0;navUpdate(true);}
}
function drawRoute(fit){
  if(!_map)return;
  if(_routeLayer){try{_routeLayer.remove();}catch(e){}_routeLayer=null;}
  const r=_route;if(!r||!r.geo)return;
  _routeLayer=L.layerGroup().addTo(_map);
  L.polyline(r.geo,{color:'#fff',weight:10,opacity:.95,interactive:false,lineCap:'round',lineJoin:'round'}).addTo(_routeLayer);
  L.polyline(r.geo,{color:'#1a73e8',weight:6,opacity:1,interactive:false,lineCap:'round',lineJoin:'round',dashArray:r.state==='straight'?'2 12':null}).addTo(_routeLayer);
  L.marker([r.dest.lat,r.dest.lng],{icon:destIcon(),zIndexOffset:900}).bindPopup('<span class="pp-name">'+esc(r.label)+'</span>').addTo(_routeLayer);
  if(fit){try{_map.fitBounds(L.latLngBounds(r.geo).pad(.18),{maxZoom:16,paddingBottomRight:[0,140]});}catch(e){}}
}
function closeRoute(){if(_nav)stopNav(true);_route=null;if(_routeLayer){try{_routeLayer.remove();}catch(e){}_routeLayer=null;}renderRouteSheet();}
function setRouteMode(m){if(!_route)return;_route.mode=m;if(!myPos){routeTo(_route.dest.lat,_route.dest.lng,_route.label,m);return;}calcRoute();}
function fmtDur(sec){const m=Math.max(1,Math.round(sec/60));return m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+(m%60)+' min':'');}
function fmtDist(m){return m<1000?Math.max(10,Math.round(m/10)*10)+' m':(m/1000).toFixed(1).replace('.',',')+' km';}
function gmapsLink(travel){
  const r=_route;const o=r&&r.from?'&origin='+r.from.lat+','+r.from.lng:'';
  return 'https://www.google.com/maps/dir/?api=1'+o+'&destination='+r.dest.lat+','+r.dest.lng+'&travelmode='+travel;
}
function renderRouteSheet(){
  const el=document.getElementById('mapxRoute');if(!el)return;
  const r=_route;if(!r){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  const M=ROUTE_MODES[r.mode||'foot'];
  let body;
  if(r.state==='loading')body='<div class="rt-info">Buscando el mejor camino…</div>';
  else if(r.state==='nopos')body='<div class="rt-info">Para armar la ruta necesitamos saber dónde estás. Permití la ubicación en el navegador (el candadito al lado de la dirección) o abrila en Google Maps.</div>';
  else body='<div class="rt-info"><b>'+(r.state==='straight'?'≈ ':'')+fmtDur(r.dur)+'</b> · '+fmtDist(r.dist)+(r.state==='straight'?'<br><small>No pudimos calcular el camino por las calles; te mostramos la distancia en línea recta.</small>':'')+'</div>';
  el.innerHTML='<div class="rt-head"><div><span class="rt-k">Cómo llegar a</span><b class="rt-to">'+esc(r.label)+'</b></div><button class="rt-x" onclick="closeRoute()" title="Cerrar ruta" aria-label="Cerrar ruta">'+ICONS.close+'</button></div>'
    +'<div class="rt-modes">'+Object.entries(ROUTE_MODES).map(([k,m])=>'<button class="'+(r.mode===k?'on':'')+'" onclick="setRouteMode(\''+k+'\')">'+ICONS[m.ico]+' '+m.t+'</button>').join('')+'</div>'
    +body
    +((r.state==='ok'||r.state==='straight')?'<button class="rt-start" onclick="startNav()">'+ICONS.play+' Iniciar</button>':'')
    +'<div class="rt-links"><a href="'+esc(gmapsLink('transit'))+'" target="_blank" rel="noopener">'+ICONS.bus+' En colectivo o subte</a><a href="'+esc(gmapsLink(M.g))+'" target="_blank" rel="noopener">Abrir en Google Maps ↗</a></div>'
    +'<div class="rt-note">La ruta la calcula OpenStreetMap. Tu ubicación no se guarda en Tablón.</div>';
}
/* ---------- Navegación paso a paso ("▶ Iniciar"), como en Google Maps ----------
   Sigue tu ubicación en vivo, te dice cuándo doblar (con voz, si querés), recalcula si te
   desviás y te avisa cuando llegaste. Si vas a un encuentro, al llegar te ofrece el check-in. */
let _nav=null,_navWatch=null,_wakeLock=null,_navVoice=true;
try{_navVoice=localStorage.getItem('tablon-navvoice')!=='0';}catch(e){}
// Flechas de navegación en SVG (como Google Maps): recto, dobla, leve, cerrada, en U.
const NAV_PATHS={straight:'M12 21V4M6 10l6-6 6 6',left:'M17 21v-8a3 3 0 0 0-3-3H5M9.5 5.5 5 10l4.5 4.5',right:'M7 21v-8a3 3 0 0 1 3-3h9M14.5 5.5 19 10l-4.5 4.5',
  'slight left':'M15 21v-7L8 6.5M8 12.5V6.5h6','slight right':'M9 21v-7l7-7.5M16 12.5V6.5h-6','sharp left':'M16 21V7l-8 9M8 10.5V16h5.5','sharp right':'M8 21V7l8 9M16 10.5V16h-5.5',
  uturn:'M16 21V9a4 4 0 0 0-8 0v5M4.5 10.5 8 14l3.5-3.5'};
function navSvg(d){return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>';}
function stepArrow(st){const m=(st&&st.maneuver)||{};if(m.type==='arrive')return ICONS.finish;if(m.type==='roundabout'||m.type==='rotary'||m.type==='roundabout turn'||m.type==='exit roundabout')return ICONS.roundabout;return navSvg(NAV_PATHS[m.modifier]||NAV_PATHS.straight);}
function stepText(st,label){
  if(!st)return 'Seguí hacia '+label;
  const m=st.maneuver||{},t=m.type,mod=m.modifier||'',nm=st.name||'';
  const dir={left:'a la izquierda',right:'a la derecha','slight left':'levemente a la izquierda','slight right':'levemente a la derecha','sharp left':'bien a la izquierda','sharp right':'bien a la derecha'}[mod]||'';
  if(t==='arrive')return 'Llegás a '+label;
  if(t==='depart')return 'Salí'+(nm?' por '+nm:'');
  if(t==='roundabout'||t==='rotary'||t==='roundabout turn')return 'En la rotonda, tomá la '+(m.exit?m.exit+'ª ':'')+'salida'+(nm?' hacia '+nm:'');
  if(mod==='uturn')return 'Pegá la vuelta'+(nm?' en '+nm:'');
  if(mod==='straight'||t==='new name'||t==='continue'||!dir)return 'Seguí derecho'+(nm?' por '+nm:'');
  if(t==='fork')return 'En la bifurcación, mantenete '+dir+(nm?' hacia '+nm:'');
  if(t==='end of road')return 'Al final de la calle, doblá '+dir+(nm?' en '+nm:'');
  return 'Doblá '+dir+(nm?' en '+nm:'');
}
function navSay(t){
  if(!_navVoice||!window.speechSynthesis)return;
  try{const u=new SpeechSynthesisUtterance(t);u.lang='es-AR';u.rate=1.02;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
function toggleNavVoice(){_navVoice=!_navVoice;try{localStorage.setItem('tablon-navvoice',_navVoice?'1':'0');}catch(e){}if(!_navVoice&&window.speechSynthesis)speechSynthesis.cancel();navUpdate();}
// distancia (m) de un punto a un tramo, en un plano local (alcanza para una ciudad)
function segDistM(p,a,b){
  const k=Math.cos(p.lat*Math.PI/180)*111320,ky=110540;
  const ax=(a[1]-p.lng)*k,ay=(a[0]-p.lat)*ky,bx=(b[1]-p.lng)*k,by=(b[0]-p.lat)*ky;
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let t=l2?-(ax*dx+ay*dy)/l2:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(ax+t*dx,ay+t*dy);
}
function distToRouteM(p,geo){let d=1e9;for(let i=1;i<geo.length;i++)d=Math.min(d,segDistM(p,geo[i-1],geo[i]));return d;}
async function startNav(){
  const r=_route;if(!r||!r.geo)return;
  if(!navigator.geolocation){addToast('Tu navegador no permite ubicar dónde estás.');return;}
  _nav={idx:0,warned:-1,off:0,follow:true,lastReroute:0,arrived:false};
  if(_meWatch!==null)stopLocate();
  try{if(navigator.wakeLock)_wakeLock=await navigator.wakeLock.request('screen');}catch(e){}
  const box=document.querySelector('.mapx');if(box)box.classList.add('navigating');
  setTimeout(()=>{try{_map.invalidateSize();}catch(e){}const x=document.querySelector('.mapx');if(x)x.scrollIntoView({behavior:'smooth',block:'start'});},60);
  if(_map)_map.setView([myPos.lat,myPos.lng],17);
  navUpdate(true);
  navSay(navInstruction().txt);
  _navWatch=navigator.geolocation.watchPosition(onNavPos,err=>{
    if(err&&err.code===1){addToast('Para navegar, permití la ubicación en el navegador.');stopNav();}
  },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
function stopNav(silent){
  if(_navWatch!==null){try{navigator.geolocation.clearWatch(_navWatch);}catch(e){}_navWatch=null;}
  try{if(_wakeLock)_wakeLock.release();}catch(e){}_wakeLock=null;
  if(window.speechSynthesis)try{speechSynthesis.cancel();}catch(e){}
  _nav=null;
  try{const el=_meMarker&&_meMarker.getElement();if(el)el.classList.remove('me-nav');}catch(e){}
  const box=document.querySelector('.mapx');if(box)box.classList.remove('navigating');
  ['navTop','navBot'].forEach(id=>{const e=document.getElementById(id);if(e){e.hidden=true;e.innerHTML='';}});
  setTimeout(()=>{try{_map.invalidateSize();}catch(e){}},60);
  if(!silent){if(_route&&_route.geo&&_map)drawRoute(true);renderRouteSheet();}
}
function navRecenter(){if(!_nav)return;_nav.follow=true;if(_map&&myPos)_map.setView([myPos.lat,myPos.lng],Math.max(_map.getZoom(),16));navUpdate();}
function navAfterRedraw(){
  const box=document.querySelector('.mapx');if(box)box.classList.add('navigating');
  if(_map){_map.on('dragstart',()=>{if(_nav){_nav.follow=false;navUpdate();}});if(myPos)_map.setView([myPos.lat,myPos.lng],17);}
  navUpdate();
}
function navInstruction(){
  const r=_route,n=_nav;if(!r||!n)return {arrow:navSvg(NAV_PATHS.straight),txt:'',dist:0};
  const st=r.steps||[];const next=st[n.idx+1];
  let dist;
  if(next&&next.maneuver)dist=distanceKm(myPos,{lat:next.maneuver.location[1],lng:next.maneuver.location[0]})*1000;
  else dist=distanceKm(myPos,r.dest)*1000;
  return {arrow:next?stepArrow(next):ICONS.finish,txt:next?stepText(next,r.label):'Seguí hacia '+r.label,dist};
}
function onNavPos(pos){
  if(!_nav||!_route)return;
  const r=_route,n=_nav;
  myPos={lat:pos.coords.latitude,lng:pos.coords.longitude};_meAccuracy=pos.coords.accuracy;
  n.heading=pos.coords.heading;
  if(_map&&document.body.contains(_map.getContainer())){
    drawMe();
    if(n.heading!=null&&!isNaN(n.heading)&&_meMarker){const el=_meMarker.getElement();if(el){el.classList.add('me-nav');el.style.setProperty('--hd',n.heading+'deg');}}
    if(n.follow)_map.setView([myPos.lat,myPos.lng],Math.max(_map.getZoom(),16),{animate:true});
  }
  const acc=Math.min(pos.coords.accuracy||20,80);
  // ¿Llegaste?
  // (el final de la ruta es la calle más cercana al lugar; en un parque grande puede quedar en el borde)
  const end=r.geo[r.geo.length-1],toEnd=distanceKm(myPos,{lat:end[0],lng:end[1]})*1000,toDest=distanceKm(myPos,r.dest)*1000;
  if(toEnd<Math.max(30,acc)||toDest<Math.max(35,acc)){navArrived();return;}
  // Avanzar de paso cuando pasás por la maniobra
  const st=r.steps||[];
  for(let k=n.idx+1;k<Math.min(st.length,n.idx+4);k++){
    const L_=st[k].maneuver.location;
    if(distanceKm(myPos,{lat:L_[1],lng:L_[0]})*1000<Math.max(20,acc*.6)){n.idx=k;n.warned=-1;const ins=navInstruction();navSay(ins.txt);break;}
  }
  // Aviso previo ("En 150 m, doblá a la derecha")
  const ins=navInstruction(),warnAt=r.mode==='foot'?60:r.mode==='bike'?120:250;
  if(ins.dist<warnAt&&ins.dist>25&&n.warned!==n.idx){n.warned=n.idx;navSay('En '+fmtDist(ins.dist)+', '+ins.txt.charAt(0).toLowerCase()+ins.txt.slice(1));}
  // ¿Te desviaste? Recalculamos (como mucho cada 12 s)
  if(r.state==='ok'){
    const off=distToRouteM(myPos,r.geo);
    n.off=off>Math.max(45,acc*1.5)?n.off+1:0;
    if(n.off>=2&&Date.now()-n.lastReroute>12000){n.lastReroute=Date.now();n.off=0;addToast('Recalculando la ruta…');calcRoute(false);return;}
  }
  navUpdate();
}
function navArrived(){

  const mt=r.meetup,label=r.label;
  stopNav(true);
  navSay('Llegaste a '+label);
  playSound('going');
  const g=mt&&getGroup(mt.gid),m=g&&g.meetups.find(x=>x.id===mt.mid),cu=currentUser();
  const canCheck=m&&cu&&m.going.includes(cu.id)&&!(m.checkins||[]).includes(cu.id)&&checkinOpen(m);
  const el=document.getElementById('mapxRoute');
  if(el){el.hidden=false;el.innerHTML='<div class="rt-head"><div><span class="rt-k">Fin del recorrido</span><b class="rt-to">'+ICONS.finish+' ¡Llegaste a '+esc(label)+'!</b></div><button class="rt-x" onclick="closeRoute()" aria-label="Cerrar">'+ICONS.close+'</button></div>'
    +(canCheck?'<button class="rt-start" onclick="doCheckin(\''+g.id+'\',\''+m.id+'\',this)">'+ICONS.pin+' Hacer check-in</button>':'');}
}
function navUpdate(first){
  const r=_route,n=_nav;
  const top=document.getElementById('navTop'),bot=document.getElementById('navBot');
  if(!top||!bot||!r||!n)return;
  const rs=document.getElementById('mapxRoute');if(rs)rs.hidden=true;
  const ins=navInstruction(),st=r.steps||[];
  let rem=ins.dist;for(let k=n.idx+1;k<st.length;k++)rem+=st[k].distance||0;
  if(!st.length)rem=distanceKm(myPos,r.dest)*1000;
  const eta=r.dist?r.dur*Math.min(1,rem/r.dist):rem/1000/ROUTE_MODES[r.mode].kmh*3600;
  const at=new Date(Date.now()+eta*1000);
  top.hidden=false;bot.hidden=false;
  top.innerHTML='<div class="nt-arrow">'+ins.arrow+'</div><div class="nt-body"><b class="nt-dist">'+fmtDist(ins.dist)+'</b><span class="nt-txt">'+esc(ins.txt)+'</span></div>';
  bot.innerHTML='<div class="nb-info"><b>'+fmtDur(eta)+'</b> · '+fmtDist(rem)+' · llegás '+String(at.getHours()).padStart(2,'0')+':'+String(at.getMinutes()).padStart(2,'0')+'</div>'
    +'<div class="nb-btns"><button onclick="toggleNavVoice()" title="Voz">'+(_navVoice?ICONS.volume:ICONS.volumeOff)+'</button>'
    +(n.follow?'':'<button onclick="navRecenter()">'+ICONS.locate+' Centrar</button>')
    +'<button class="nb-exit" onclick="stopNav()">Salir</button></div>';
}

/* "Cómo llegar" desde el ticket de un encuentro: abre el mapa con la ruta armada. */
async function routeToMeetup(gid,mid){
  const g=getGroup(gid),m=g&&g.meetups.find(x=>x.id===mid);if(!m)return;
  const c=await exactCoords(g,m);if(!c){addToast('No sabemos dónde queda este lugar.');return;}
  _pendingRoute={lat:c.lat,lng:c.lng,label:m.place?m.place.split(',')[0]:g.zone,meetup:{gid,mid}};
  if(!exploreMapOpen)exploreMapOpen=true;
  setAppView('explorar');
  setTimeout(()=>{const x=document.getElementById('exploreMap');if(x)x.scrollIntoView({behavior:'smooth',block:'center'});},300);
}

  if(state.isModerator)return true;
  return state.groups.some(g=>g.admins.includes(state.currentUserId));
}

function renderInicio(cu){
  const myGroups=state.groups.filter(g=>g.members.includes(cu.id));
  // Solo lo que viene, ordenado por fecha (los pasados quedan en cada grupo).
  const upcoming=[];
  myGroups.forEach(g=>upcomingOf(g).forEach(m=>upcoming.push({g,m})));
  upcoming.sort((a,b)=>meetupKey(a.m)<meetupKey(b.m)?-1:1);
  const recs=recommendGroups(cu,myGroups.length?3:6);
  // Encuentros que vienen en grupos donde todavía no estás, de tus temas.
  const discover=allUpcoming().filter(({g})=>!g.members.includes(cu.id)&&cu.categories.includes(g.categoryId)).slice(0,3);
  const pendingRecaps=[];
  myGroups.forEach(g=>pastOf(g).forEach(m=>{
    if(m.going.includes(cu.id)&&!(m.recaps||[]).some(r=>r.authorId===cu.id)&&daysFromToday(m.eventDate||'1900-01-01')>=-14)pendingRecaps.push({g,m});
  }));

  const recsHTML=recs.length?`
    <div class="block-title" style="margin-top:34px">Grupos que te pueden gustar</div>
    <div class="card-grid">${recs.map(recommendedCardHTML).join('')}</div>`:'';
  const discoverHTML=discover.length?`
    <div class="block-title" style="margin-top:34px">Encuentros de tus temas en otros grupos</div>
    ${discover.map(({g,m})=>`
      <div class="upnext-row" onclick="openMeetup('${g.id}','${m.id}')">
        <div>
          <div class="ttitle">${esc(m.title)} · <span style="color:var(--text-faint);font-weight:500">${esc(g.name)}</span></div>
          <div class="tmeta">${ICONS.pin} ${esc(placeShort(m))} — ${esc(meetupWhen(m))}</div>
          ${m.level&&m.level!=='todos'?`<div class="badges-row">${levelBadge(m)}</div>`:''}
        </div>
        <div class="notch-badge">${esc(catLabel(g.categoryId))}</div>
      </div>`).join('')}`:'';

  if(myGroups.length===0){
    return `
    <h1 class="app-h1">Hola, ${esc(cu.name.split(' ')[0])}.</h1>
    <p class="app-sub">Todavía no estás en ningún grupo. Arranquemos.</p>
    ${greenCardHTML(cu)}
    <div class="empty-state">
      <h3>Tu tablón está vacío</h3>
      <p>Explorá los grupos que ya se están juntando en tu ciudad, o armá el tuyo si el tema que buscás todavía no existe.</p>
      <div class="empty-actions">
        <button class="btn btn-primary" onclick="setAppView('explorar')">${ICONS.compass}Explorar grupos</button>
        <button class="btn btn-dark" onclick="setAppView('crear')">${ICONS.plus}Crear un grupo</button>
      </div>
    </div>
    ${cu.categories.length?'':`<p class="app-sub" style="margin-top:18px">Tip: elegí tus temas en <button class="link-btn" onclick="openProfile()">Mi perfil</button> y te recomendamos grupos.</p>`}
    ${recsHTML}${discoverHTML}`;
  }

  return `
  <h1 class="app-h1">Hola, ${esc(cu.name.split(' ')[0])}.</h1>
  <p class="app-sub">Esto es lo que se viene en tus grupos.</p>
  ${greenCardHTML(cu)}

  ${pendingRecaps.length?`
  <div class="safety-card" style="border-left-color:var(--yellow)">
    <b>¿Cómo estuvo?</b> Fuiste a ${pendingRecaps.length===1?'"'+esc(pendingRecaps[0].m.title)+'"':plural(pendingRecaps.length,'encuentro')}. Contale al grupo cómo salió (y subí una foto si querés).
    <div style="margin-top:10px"><button class="btn btn-sm btn-dark" onclick="openMeetup('${pendingRecaps[0].g.id}','${pendingRecaps[0].m.id}');state.recapFormMeetupId='${pendingRecaps[0].m.id}';render()">Contar cómo estuvo</button></div>
  </div>`:''}

  <div class="block-title">Tus próximos encuentros <button class="link-btn" style="font-size:12.5px;display:inline-flex;align-items:center;gap:5px" onclick="openCalendar()">${ICONS.calendar}Ver calendario</button></div>
  ${upcoming.length?upcoming.slice(0,6).map(({g,m})=>{
    const going=m.going.includes(cu.id),waiting=(m.waitlist||[]).includes(cu.id);
    return `
    <div class="upnext-row" onclick="openMeetup('${g.id}','${m.id}')">
      <div>
        <div class="ttitle">${esc(m.title)} · <span style="color:var(--text-faint);font-weight:500">${esc(g.name)}</span></div>

function renderCalendario(cu){
  const filter=state.calFilter;
  const events=calendarEvents(cu,filter);
  const byDay={};
  events.forEach(e=>{if(e.m.eventDate)(byDay[e.m.eventDate]=byDay[e.m.eventDate]||[]).push(e);});
  const undated=events.filter(e=>!e.m.eventDate);
  const today=todayYmd();
  const sel=calSelectedDay();
  const month=calMonthShown();
  const [y,mo]=month.split('-').map(Number);
  const lead=(new Date(y,mo-1,1).getDay()+6)%7; // la semana arranca el lunes
  const cells=[];
  for(let i=0;i<42;i++)cells.push(ymd(new Date(y,mo-1,1-lead+i)));

  const myNext=calendarEvents(cu,'going').filter(e=>e.m.eventDate&&!isMeetupPast(e.m));
  const next=myNext[0];
  const upcoming=events.filter(e=>e.m.eventDate&&!isMeetupPast(e.m)).slice(0,6);
  const dayEvents=byDay[sel]||[];
  const selDate=parseYmd(sel);
  const selRel=daysFromToday(sel);
  const monthCount=events.filter(e=>e.m.eventDate&&e.m.eventDate.slice(0,7)===month).length;

  let nextBanner;
  if(next){
    const n=daysFromToday(next.m.eventDate);
    nextBanner=`
    <div class="cal-next" onclick="calSelectDay('${next.m.eventDate}')" title="Ver ese día en el calendario">
      <span class="tape"></span>
      <div class="cn-count">
        <div class="n">${n===0?'HOY':n}</div>
        <div class="l">${n===0?'a las '+esc(next.m.eventTime||''):n===1?'día':'días'}</div>
      </div>
      <div class="cn-info">
        <div class="eyebrow">tu próximo plan</div>
        <h2 class="cn-title">${esc(next.m.title)}</h2>
        <div class="cn-meta">

/* ================= PERFIL =================
   Tu perfil (editable) o el de otra persona (solo lectura). Todas las
   estadísticas salen de lo que ya trajo el bootstrap, sin pedir nada extra. */
function profileStats(u){
  const groups=state.groups.filter(g=>g.members.includes(u.id));
  let meetupsGoing=0,posts=0,reactionsGot=0;
  state.groups.forEach(g=>{
    g.meetups.forEach(m=>{if(m.going.includes(u.id))meetupsGoing++;});
    (g.posts||[]).forEach(p=>{if(p.authorId===u.id){posts++;reactionsGot+=reactionTotal(p);}});
  });
  return {groups,meetupsGoing,posts,reactionsGot,friends:u.friends.length};
}

      </div>
      <div class="field"><label>Lugar</label><input name="place" value="${esc(m.place||'')}" list="safezones-list-meetup" maxlength="200" placeholder="Elegí un lugar público sugerido o escribí el tuyo" required/>${safeZonesDatalist('safezones-list-meetup')}</div>

    <div class="ticket ${state.highlightMeetupId===m.id?'highlight':''}" id="meetup-${m.id}">
      <div class="tinfo" style="min-width:0">
        <div class="t-title">${esc(m.title)}${m.edited?' <span class="mono" style="font-size:10.5px;color:var(--text-dim);font-weight:400">(editado)</span>':''}</div>
        <div class="t-meta">${m.placeHidden?`<span class="place-lock">${ICONS.lock}${esc(placeText(m))}</span>`:ICONS.pin+' '+esc(m.place)} <span>${esc(meetupWhen(m))}</span> <span>${esc(relDayLabel(daysFromToday(m.eventDate)))}</span></div>
        <div class="badges-row">${levelBadge(m)}${isOutdoor(m)?'<span class="mini-badge outdoor-badge">'+ICONS.tree+' Al aire libre</span>':''}${full?'<span class="mini-badge badge-full">Completo</span>':''}${m.going.includes(cu.id)?'<span class="mini-badge fill" style="--c:var(--green)">Vas</span>':''}${weatherChipHTML(m,true)}</div>
        <div class="tgoing" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          ${people.length?`<span class="avatar-stack">${people.slice(0,6).map(u=>avatarHTML(u,22)).join('')}</span>`:''}
          ${esc(spotsLabel(m))}${waiting?' · '+plural(waiting,'en espera','en espera'):''}
        </div>
        ${m.capacity!=null?`<div class="cap-bar ${full?'full':''}"><i style="width:${Math.min(100,Math.round(m.going.length/m.capacity*100))}%"></i></div>`:''}
        ${transitHTML(g,m)}
        ${checkinBtnHTML(g,m,cu)?`<div style="margin-top:10px">${checkinBtnHTML(g,m,cu)}</div>`:''}
        <div class="ticket-links">

          ${!m.placeHidden?`<button class="tk-act" onclick="routeToMeetup('${g.id}','${m.id}')">${ICONS.directions} Cómo llegar</button>`:''}
          <button class="tk-act" onclick="shareMeetup('${g.id}','${m.id}')">${ICONS.share}Compartir</button>
          <span class="tk-sep"></span>
          ${isOwner?`<button class="tk-act ghost" onclick="startEditMeetup('${m.id}')">${ICONS.edit}Editar</button>`:''}
          ${canManage?`<button class="tk-act ghost danger" onclick="deleteMeetup('${m.id}')">${ICONS.trash}Borrar</button>`:''}
          ${!isOwner&&m.createdBy!==state.currentUserId?`<button class="tk-act ghost" onclick="openReport('meetup','${m.id}',${m.createdBy?`'${m.createdBy}'`:'null'})">${ICONS.flag}Denunciar</button>`:''}

function renderEncuentrosTab(g,cu,isMember,isAdmin){
  const upcoming=upcomingOf(g);
  const past=pastOf(g);
  // Encuentros que empezaron hace menos de 4 h: arriba, con el check-in "📍 Estoy acá" a mano.
  const live=past.filter(m=>checkinOpen(m));
  const editing=state.editingMeetupId?g.meetups.find(m=>m.id===state.editingMeetupId):null;
  return `
  <details class="safety-card"><summary>${ICONS.shield}Consejos para encontrarte seguro</summary>${SAFETY_LIST}</details>
  ${isMember?`
    ${state.meetupFormOpen?`
    <div class="inline-form">
      <form onsubmit="addMeetup(event,'${g.id}')">
        ${meetupFormFields()}
        <div class="mono" style="font-size:10.5px;color:var(--text-dim);margin:10px 0 2px">Para un primer encuentro, mejor un lugar público y con gente alrededor.</div>
        <div style="display:flex;gap:10px;margin-top:14px">
          <button class="btn btn-primary btn-sm" type="submit">Publicar encuentro</button>
          <button class="btn btn-ghost btn-sm" type="button" style="border-color:var(--ink);color:var(--ink);box-shadow:3px 3px 0 rgba(20,22,31,0.15)" onclick="toggleMeetupForm()">Cancelar</button>
        </div>
      </form>
    </div>`:`<button class="btn btn-dark btn-sm" style="margin-bottom:20px" onclick="toggleMeetupForm()">${ICONS.plus}Organizar un encuentro</button>`}
  `:`<div class="empty-state" style="margin-bottom:20px"><p style="margin:0">Unite al grupo para organizar encuentros y anotarte.</p></div>`}

  ${editing?`<div class="inline-form">
      <form onsubmit="editMeetup(event,'${editing.id}')">
        ${meetupFormFields(editing)}
        <div style="display:flex;gap:10px;margin-top:14px">
          <button class="btn btn-primary btn-sm" type="submit">Guardar cambios</button>
          <button class="btn btn-ghost btn-sm" type="button" style="border-color:var(--ink);color:var(--ink);box-shadow:3px 3px 0 rgba(20,22,31,0.15)" onclick="cancelEditMeetup()">Cancelar</button>
        </div>
      </form>
    </div>`:''}

  ${live.length?`<div class="section-label"><span class="live-dot"></span>Pasando ahora</div>${live.map(m=>pastTicketHTML(g,m,cu,isAdmin)).join('')}`:''}

  <div class="section-label">Próximos</div>
  ${upcoming.length?upcoming.filter(m=>!editing||m.id!==editing.id).map(m=>upcomingTicketHTML(g,m,cu,isMember,isAdmin)).join('')
    :`<div class="empty-state"><p style="margin:0">No hay encuentros programados.${isMember?' ¡Proponé el próximo!':''}</p></div>`}

  ${isMember||state.isModerator?polaroidWallHTML(g):''}

  ${past.length?`
  <div class="section-label">Encuentros anteriores (${past.length})</div>
  ${state.showPastMeetups?past.map(m=>pastTicketHTML(g,m,cu,isAdmin)).join('')+`<button class="link-btn" onclick="state.showPastMeetups=false;render()">Ocultar anteriores</button>`
    :`<button class="btn btn-sm btn-ghost" style="border-color:var(--ink);color:var(--ink);box-shadow:none" onclick="state.showPastMeetups=true;render()">Ver encuentros anteriores y reseñas</button>`}`:''}
  `;
}

function commentHTML(c,cu,isAdmin){

  const author=getUser(c.authorId);
  const canDelete=c.authorId===cu.id||isAdmin||state.isModerator;
  return `<div style="display:flex;gap:8px;margin-top:10px">
    ${avatarHTML(author||{name:'?',colorIdx:0},26)}
    <div style="flex:1;background:var(--paper-2);border-radius:5px;padding:8px 10px">

}

function reactButtonsHTML(p,cu){
  const mine=myReactionOn(p,cu.id);
  const def=mine?reactionDef(mine):null;
  const pickerOpen=state.reactPickerPostId===p.id;
  return `<div class="react-wrap">
    <button class="react-btn ${mine?'mine':''}" style="${def?'--rc:'+def.color+';color:'+def.color:''}" onclick="quickReact('${p.id}')" title="${mine?'Sacar tu reacción':'Me gusta'}">
      ${mine?reactionSVG(mine,16):ICONS.thumb}${def?esc(def.label):'Me gusta'}
    </button>
    <button class="react-more" onclick="toggleReactPicker('${p.id}')" title="Elegir reacción">${ICONS.smilePlus}</button>
    ${pickerOpen?`<div class="react-picker">
      ${REACTIONS.map(r=>`<button class="react-opt ${mine===r.id?'mine':''}" onclick="reactToPost('${p.id}','${r.id}')" aria-label="${esc(r.label)}">
        ${reactionSVG(r.id,30)}<span class="ro-label">${esc(r.label)}</span>
      </button>`).join('')}
    </div>`:''}
  </div>`;
}
function reactionSummaryHTML(p){
  const total=reactionTotal(p);
  if(!total)return '';
  const r=p.reactions||{};
  const top=REACTIONS.filter(d=>(r[d.id]||[]).length).sort((a,b)=>r[b.id].length-r[a.id].length).slice(0,3);
  const names=reactionNames(p);
  const tip=names.slice(0,12).join('\n')+(names.length>12?'\ny '+(names.length-12)+' más':'');
  return `<span class="react-summary" title="${esc(tip)}">
    <span class="react-stack">${top.map(d=>reactionSVG(d.id,18)).join('')}</span>${total}
  </span>`;
}

      <div class="char-counter" id="postCounter">0/500</div>

    <button class="btn btn-sm btn-primary" type="submit">Publicar</button>
  </form>`:`<div class="empty-state" style="margin-bottom:20px"><p style="margin:0">Unite al grupo para participar del muro.</p></div>`}
  ${posts.length?posts.map(p=>{
    const author=getUser(p.authorId);

            <div style="display:flex;gap:10px;margin-top:8px">

            </div>
          </form>
        </div></div>`;
    }
    return `<div class="post">${author?`<button class="user-link" onclick="openProfile('${author.id}')" title="Ver perfil">${avatarHTML(author,36)}</button>`:avatarHTML({name:'?',colorIdx:0},36)}
      <div class="p-body">
        <div class="p-head">${author?`<button class="user-link p-name" onclick="openProfile('${author.id}')">${esc(author.name)}</button>`:`<span class="p-name">Alguien</span>`}<span class="p-time">${esc(p.time)}${p.edited?' · editado':''}</span></div>
        <div class="p-text">${esc(p.text)}</div>
        <div class="post-actions">
          ${isMember?reactButtonsHTML(p,cu):''}
          <button class="link-btn" style="font-size:11.5px" onclick="toggleComments('${p.id}')">${comments.length?comments.length+' comentario'+(comments.length===1?'':'s'):'Comentar'}</button>
          ${isOwner?`<button class="link-btn" style="font-size:11.5px" onclick="startEditPost('${p.id}')">Editar</button>`:''}

          ${reportLink('post',p.id,p.authorId)}

          ${comments.map(c=>commentHTML(c,cu,isAdmin)).join('')}

        `:''}

  }).join(''):`<div class="empty-state"><p style="margin:0">Todavía no hay nada publicado en el muro.</p></div>`}

        ${isAdmin&&!isSelf?`
          ${userIsAdmin?`<button class="link-btn" style="font-size:11px" onclick="demoteAdmin('${g.id}','${u.id}')">Sacar admin</button>`
                        :`<button class="link-btn" style="font-size:11px" onclick="promoteAdmin('${g.id}','${u.id}')">Hacer admin</button>`}
          <button class="link-btn" style="font-size:11px;color:#c9425e" onclick="removeMember('${g.id}','${u.id}')">Expulsar</button>
        `:''}
      </div>
    </div>`;
  }).join('');
}

/* ================= MASTER RENDER ================= */
function render(){
  const app=document.getElementById('app');
  if(state.loading){
    app.innerHTML=splashHTML();
    return;
  }
  if(state.loadError){
    app.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">'
      +'<div style="max-width:520px;background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:6px;padding:28px 26px">'
      +'<h2 style="font-family:Anton,sans-serif;text-transform:none;margin:0 0 12px">No pudimos conectar con el servidor</h2>'
      +'<p style="margin:0 0 10px;line-height:1.5">'+esc(state.loadError)+'</p>'
      +'<p class="mono" style="font-size:12px;color:var(--text-faint);margin:0">Puede ser algo momentáneo. Si el problema sigue en unos minutos, probá más tarde.</p>'
      +'<button class="btn btn-dark btn-sm" style="margin-top:16px" onclick="location.reload()">Reintentar</button>'
      +'</div></div>';
    return;
  }
  // Si la sesión quedó apuntando a un usuario que ya no existe (por ejemplo,
  // se borró la cuenta desde la base), no rompemos la página: la tratamos
  // como si hubiera cerrado sesión.
  if(state.view==='app'&&!currentUser()){
    state.view='landing';
    state.currentUserId=null;
    apiCall('logout').catch(()=>{}); // limpiamos la cookie vieja del servidor, sin bloquear el render
  }

  const view=state.view;
  app.innerHTML=
    view==='landing'?renderLanding():
    view==='checkEmail'?renderCheckEmail():
    view==='forgotPassword'?renderForgotPassword():
    view==='resetSent'?renderResetSent():
    view==='resetPassword'?renderResetPassword():
    view==='onboarding'?renderOnboarding():
    renderApp();
  renderToasts();
  if(state.view==='landing')initReveal();
  window.scrollTo({top:document.body.scrollTop?0:window.scrollY});
  if(state.view==='app'){
    const vk=state.appView+'|'+(state.activeGroupId||'')+'|'+(state.groupTab||'')+'|'+(state.profileUserId||'');
    if(vk!==_lastViewKey){_lastViewKey=vk;const ac=document.querySelector('.app-content');if(ac&&!reduceMotion())ac.classList.add('view-in');}
    syncRoute();
    chatAfterRender();
    if(state.appView==='explorar')updateExploreGrid();
    fillGreenSuggest();
    if(state.highlightMeetupId){
      const id=state.highlightMeetupId;state.highlightMeetupId=null;
      setTimeout(()=>{const el=document.getElementById('meetup-'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},60);
    }
  }else stopChat();
}

function initReveal(){
  const els=document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)||reduceMotion()){els.forEach(el=>el.classList.add('in'));return;}
  // Lo que ya está en pantalla aparece al toque; el resto, apenas asoma (sin esperar a que entre entero).
  const vh=window.innerHeight||800;
  const obs=new IntersectionObserver((entries)=>{
    entries.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');obs.unobserve(en.target);}});
  },{threshold:0,rootMargin:'0px 0px 80px 0px'});
  els.forEach(el=>{
    const r=el.getBoundingClientRect();
    if(r.top<vh)el.classList.add('in');else obs.observe(el);
  });
}

document.addEventListener('click', function(e){
  // Si el click ya re-dibujó la pantalla, el elemento tocado quedó afuera
  // del documento: en ese caso no hay "click afuera" que procesar.
  if(!document.body.contains(e.target))return;
  if(state.notifPanelOpen && !e.target.closest('.notif-bell') && !e.target.closest('.notif-panel')){
    closeNotifPanel();
    render();
  }
  let changed=false;
  if(state.profileMenuOpen && !e.target.closest('.profile-trigger') && !e.target.closest('.profile-menu')){
    state.profileMenuOpen=false;changed=true;
  }
  if(state.reactPickerPostId && !e.target.closest('.react-wrap')){
    state.reactPickerPostId=null;changed=true;
  }
  if(changed)render();
});
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'&&state.stickerCele){closeStickerCele();return;}
  if(e.key==='Escape'&&(state.profileMenuOpen||state.reactPickerPostId||state.reportModal||state.shareModal||state.ticketModal||state.lightbox)){
    if(state.ticketModal&&state.ticketModal.url)URL.revokeObjectURL(state.ticketModal.url);
    state.profileMenuOpen=false;state.reactPickerPostId=null;state.reportModal=null;state.shareModal=null;state.ticketModal=null;state.lightbox=null;render();
    return;
  }
  // Calendario: flechas para moverse entre días
  if(state.view==='app'&&state.appView==='calendario'&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable)return;
    const step={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[e.key];
    if(step){e.preventDefault();calMoveSelection(step);}
  }
});

(async function init(){
  applyTheme();
  try{
    await loadBootstrap();
    state.loading=false;
    const resetToken=new URLSearchParams(location.search).get('reset');
    if(resetToken){
      state.resetToken=resetToken;
      state.view='resetPassword';
    }else{
      state.view=state.currentUserId?'app':'landing';
      // Entró por un link compartido (#/grupo/3, #/encuentro/9...)
      if(isAppRoute(location.hash)){
        if(state.currentUserId){_applyingRoute=true;applyRoute(location.hash);}
        else{state.pendingRoute=location.hash;state.authOpen=true;state.authTab='login';setTimeout(()=>addToast('Entrá (o probá la demo) para ver lo que te compartieron.'),300);}
      }
    }
  }catch(err){
    state.loading=false;
    state.loadError=err.message||'No pudimos conectar con el servidor.';
  }
  render();
  _applyingRoute=false;
})();
window.addEventListener('hashchange',()=>{
  if(state.view==='app'&&isAppRoute(location.hash)&&location.hash!==currentRoute()){
    _applyingRoute=true;if(applyRoute(location.hash))render();_applyingRoute=false;window.scrollTo(0,0);
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&chatActive())pollChat();});
</script>
